<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#f5f7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Route Reconstruction</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
/* =========================================================
   BASE
========================================================= */

:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#172033;
    --sub:#687386;
    --border:#e3e7ee;
    --blue:#1d74f5;
    --blue-dark:#125dcc;
    --danger:#ef4444;
    --shadow:0 12px 35px rgba(20,30,50,.10);
    --radius:18px;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

/* =========================================================
   APP
========================================================= */

#app{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar{
    position:relative;
    z-index:1000;
    height:68px;
    min-height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:
        env(safe-area-inset-top)
        14px
        0
        14px;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(220,225,233,.9);
}

.topbar-left{
    display:flex;
    align-items:center;
    min-width:0;
}

.logo-mark{
    width:38px;
    height:38px;
    border-radius:12px;
    margin-right:10px;
    position:relative;
    background:
        linear-gradient(135deg,#1d74f5 0%,#6ea8ff 48%,#dceaff 100%);
    box-shadow:
        inset 0 1px 1px rgba(255,255,255,.7),
        0 5px 14px rgba(29,116,245,.22);
}

.logo-mark::before{
    content:"";
    position:absolute;
    left:9px;
    top:8px;
    width:20px;
    height:20px;
    border:3px solid white;
    border-radius:7px;
    transform:rotate(45deg);
}

.logo-mark::after{
    content:"";
    position:absolute;
    left:16px;
    top:15px;
    width:8px;
    height:8px;
    border-radius:50%;
    background:white;
}

.title-wrap{
    min-width:0;
}

.title{
    font-size:16px;
    font-weight:800;
    line-height:1.15;
    white-space:nowrap;
}

.subtitle{
    margin-top:3px;
    color:var(--sub);
    font-size:10px;
    white-space:nowrap;
}

.top-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:42px;
    height:42px;
    border-radius:13px;
    background:#f0f3f8;
    color:#283246;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    box-shadow:inset 0 0 0 1px rgba(220,225,234,.75);
}

.icon-btn.active{
    background:#e6f0ff;
    color:var(--blue);
}

/* =========================================================
   MAP
========================================================= */

#map{
    flex:1;
    min-height:0;
    position:relative;
    z-index:1;
}

.leaflet-container{
    width:100%;
    height:100%;
    background:#e8edf3;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        sans-serif;
}

.leaflet-control-attribution{
    font-size:9px !important;
}

.leaflet-control-scale-line{
    font-size:10px !important;
    border-color:#333 !important;
    color:#222 !important;
    background:rgba(255,255,255,.8) !important;
}

/* =========================================================
   HELP PILL
========================================================= */

.help-pill{
    position:absolute;
    left:50%;
    top:78px;
    transform:translateX(-50%);
    z-index:500;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    padding:8px 13px;
    border-radius:999px;
    box-shadow:0 8px 22px rgba(20,30,50,.12);
    border:1px solid rgba(220,225,233,.85);
    font-size:12px;
    color:#455066;
    pointer-events:none;
    opacity:0;
    transition:.2s;
    white-space:nowrap;
}

.help-pill.show{
    opacity:1;
}

/* =========================================================
   MODE BAR
========================================================= */

.modebar{
    position:absolute;
    z-index:700;
    left:50%;
    bottom:
        calc(15px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    display:flex;
    padding:5px;
    gap:4px;
    border-radius:17px;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:var(--shadow);
    border:1px solid rgba(220,225,233,.9);
}

.mode-btn{
    min-width:64px;
    height:42px;
    padding:0 11px;
    border-radius:12px;
    background:transparent;
    color:#596579;
    font-size:12px;
    font-weight:700;
}

.mode-btn.active{
    background:#e9f2ff;
    color:var(--blue);
}

/* =========================================================
   INFO CARD
========================================================= */

.info-card{
    position:absolute;
    z-index:600;
    left:14px;
    bottom:
        calc(76px + env(safe-area-inset-bottom));
    max-width:310px;
    padding:10px 13px;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(220,225,233,.9);
    border-radius:14px;
    box-shadow:0 8px 25px rgba(20,30,50,.10);
    font-size:10px;
    line-height:1.55;
    color:#687386;
}

.info-card strong{
    color:#354055;
}

/* =========================================================
   POINT ICON
========================================================= */

.route-point-icon{
    width:30px;
    height:30px;
    border-radius:50%;
    background:white;
    border:4px solid var(--blue);
    box-shadow:
        0 2px 8px rgba(0,0,0,.25),
        0 0 0 2px rgba(255,255,255,.85);
}

.route-point-icon.selected{
    border-color:#111827;
    transform:scale(1.08);
}

/* =========================================================
   ARROW
========================================================= */

.route-arrow{
    width:0;
    height:0;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:15px solid var(--blue);
    filter:
        drop-shadow(0 1px 2px rgba(0,0,0,.35));
    transform-origin:50% 65%;
}

/* =========================================================
   LINE DRAWING
========================================================= */

#lineEditor{
    position:absolute;
    z-index:800;
    top:76px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    align-items:center;
    gap:6px;
    padding:6px;
    border-radius:15px;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(14px);
    box-shadow:var(--shadow);
}

#lineEditor.show{
    display:flex;
}

.line-editor-btn{
    height:34px;
    padding:0 12px;
    border-radius:10px;
    font-size:12px;
    font-weight:700;
}

.line-editor-undo{
    background:#f0f3f8;
    color:#445066;
}

.line-editor-ok{
    background:#e8f2ff;
    color:var(--blue);
}

.line-editor-cancel{
    background:#fff0f0;
    color:var(--danger);
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop{
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(15,23,42,.38);
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    display:none;
    align-items:flex-end;
    justify-content:center;
}

.modal-backdrop.show{
    display:flex;
}

.modal{
    width:min(560px,100%);
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:24px 24px 0 0;
    padding:
        20px
        18px
        calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -15px 50px rgba(0,0,0,.18);
    animation:modalUp .18s ease;
}

@keyframes modalUp{
    from{
        transform:translateY(30px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.modal-title{
    font-size:19px;
    font-weight:800;
    margin-bottom:17px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:7px;
    font-size:12px;
    color:#657085;
    font-weight:700;
}

.field input,
.field textarea{
    width:100%;
    border:1px solid #dfe4ec;
    background:#f8f9fc;
    border-radius:12px;
    padding:12px;
    outline:none;
    color:#172033;
}

.field input:focus,
.field textarea:focus{
    border-color:#8db9ff;
    box-shadow:0 0 0 3px rgba(29,116,245,.10);
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.action-btn{
    flex:1;
    min-height:46px;
    border-radius:13px;
    font-weight:800;
}

.btn-cancel{
    background:#eef1f5;
    color:#566176;
}

.btn-delete{
    background:#fff0f0;
    color:#dc3030;
}

.btn-save{
    background:var(--blue);
    color:white;
}

/* =========================================================
   COLOR PICKER
========================================================= */

.color-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.color-choice{
    width:34px;
    height:34px;
    border-radius:50%;
    border:3px solid white;
    box-shadow:0 0 0 1px #d8dde6;
}

.color-choice.selected{
    box-shadow:
        0 0 0 2px #111827,
        0 0 0 4px white;
}

/* =========================================================
   WIDTH
========================================================= */

.width-row{
    display:flex;
    gap:8px;
}

.width-choice{
    flex:1;
    min-height:38px;
    border-radius:10px;
    background:#f0f3f7;
    color:#566176;
    font-weight:700;
}

.width-choice.selected{
    background:#e7f0ff;
    color:var(--blue);
}

/* =========================================================
   MENU
========================================================= */

.menu-backdrop{
    position:fixed;
    inset:0;
    z-index:2500;
    display:none;
}

.menu-backdrop.show{
    display:block;
}

.menu-panel{
    position:absolute;
    top:62px;
    right:10px;
    width:270px;
    max-width:calc(100vw - 20px);
    background:white;
    border:1px solid #e1e5ec;
    border-radius:17px;
    box-shadow:0 15px 40px rgba(20,30,50,.18);
    padding:7px;
}

.menu-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:45px;
    border-radius:11px;
    padding:0 12px;
    background:white;
    color:#303b4f;
    text-align:left;
    font-size:13px;
    font-weight:700;
}

.menu-item:hover{
    background:#f3f6fa;
}

.menu-item.danger{
    color:#dc3030;
}

.menu-divider{
    height:1px;
    background:#edf0f4;
    margin:6px 5px;
}

/* =========================================================
   JSON MODAL
========================================================= */

.json-overlay{
    position:fixed;
    inset:0;
    z-index:4000;
    display:none;
    background:rgba(15,23,42,.45);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.json-overlay.show{
    display:flex;
}

.json-panel{
    width:min(850px,100%);
    height:min(720px,90vh);
    background:white;
    border-radius:22px;
    padding:17px;
    display:flex;
    flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.22);
}

.json-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.json-title strong{
    font-size:17px;
}

.json-close{
    width:38px;
    height:38px;
    border-radius:11px;
    background:#eef1f5;
}

#jsonText{
    flex:1;
    width:100%;
    resize:none;
    border:1px solid #dfe4ec;
    border-radius:13px;
    padding:12px;
    background:#f8f9fc;
    color:#253047;
    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;
    font-size:11px;
    line-height:1.5;
    outline:none;
}

.json-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:10px;
}

.json-action{
    min-height:40px;
    padding:0 12px;
    border-radius:11px;
    background:#edf1f6;
    color:#3f4b61;
    font-size:12px;
    font-weight:700;
}

.json-action.primary{
    background:#e7f0ff;
    color:var(--blue);
}

.json-action.danger{
    background:#fff0f0;
    color:#d83131;
}

/* =========================================================
   EXPORT OVERLAY
========================================================= */

.export-overlay{
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(15,23,42,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
}

.export-overlay.show{
    display:flex;
}

.export-panel{
    width:min(500px,100%);
    background:white;
    border-radius:23px;
    padding:20px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.export-title{
    font-size:19px;
    font-weight:800;
    margin-bottom:6px;
}

.export-description{
    font-size:12px;
    line-height:1.6;
    color:#697489;
    margin-bottom:15px;
}

.export-section{
    margin-bottom:14px;
}

.export-label{
    font-size:11px;
    font-weight:800;
    color:#697489;
    margin-bottom:7px;
}

.export-select{
    width:100%;
    height:43px;
    border:1px solid #dfe4ec;
    background:#f8f9fc;
    border-radius:12px;
    padding:0 10px;
}

.export-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.export-btn{
    flex:1;
    min-width:140px;
    min-height:46px;
    border-radius:13px;
    background:#edf1f6;
    color:#39465b;
    font-weight:800;
}

.export-btn.primary{
    background:var(--blue);
    color:white;
}

.export-btn.satellite{
    background:#e8eef5;
}

.export-close{
    width:100%;
    min-height:42px;
    border-radius:12px;
    background:#f0f2f5;
    margin-top:10px;
    color:#566176;
    font-weight:700;
}

/* =========================================================
   EXPORT PROGRESS
========================================================= */

.export-progress{
    position:fixed;
    inset:0;
    z-index:6000;
    background:rgba(15,23,42,.62);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.export-progress.show{
    display:flex;
}

.progress-card{
    width:min(430px,100%);
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.progress-title{
    font-size:17px;
    font-weight:800;
    margin-bottom:8px;
}

.progress-text{
    font-size:12px;
    color:#667287;
    line-height:1.5;
    margin-bottom:12px;
}

.progress-track{
    width:100%;
    height:8px;
    border-radius:99px;
    background:#e9edf2;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#1d74f5;
    transition:width .15s ease;
}

.progress-percent{
    margin-top:8px;
    text-align:right;
    font-size:11px;
    color:#6a7587;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .topbar{
        height:64px;
        min-height:64px;
    }

    .logo-mark{
        width:35px;
        height:35px;
    }

    .title{
        font-size:14px;
    }

    .subtitle{
        font-size:9px;
    }

    .icon-btn{
        width:38px;
        height:38px;
    }

    .mode-btn{
        min-width:57px;
        padding:0 7px;
        font-size:11px;
    }

    .info-card{
        max-width:250px;
        font-size:9px;
    }

    .help-pill{
        top:70px;
        font-size:10px;
    }

    .line-editor{
        top:69px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <div class="topbar">

        <div class="topbar-left">

            <div class="logo-mark"></div>

            <div class="title-wrap">
                <div class="title">Route Reconstruction</div>
                <div class="subtitle">手動ルート再構成</div>
            </div>

        </div>

        <div class="top-actions">

            <button
                id="satelliteBtn"
                class="icon-btn"
                title="航空写真"
                aria-label="航空写真">
                🛰️
            </button>

            <button
                id="saveBtn"
                class="icon-btn"
                title="保存"
                aria-label="保存">
                💾
            </button>

            <button
                id="menuBtn"
                class="icon-btn"
                title="メニュー"
                aria-label="メニュー">
                ⋯
            </button>

        </div>

    </div>


    <!-- =====================================================
         MAP
    ====================================================== -->

    <div id="map"></div>


    <!-- =====================================================
         HELP
    ====================================================== -->

    <div id="helpPill" class="help-pill"></div>


    <!-- =====================================================
         INFO
    ====================================================== -->

    <div class="info-card">
        <strong>手動ルート再構成</strong><br>
        地点・線は自由に配置できます。<br>
        ※このデータは過去GPSログではありません。
    </div>


    <!-- =====================================================
         LINE EDITOR
    ====================================================== -->

    <div id="lineEditor">

        <button
            id="lineUndoBtn"
            class="line-editor-btn line-editor-undo">
            ↩ 戻す
        </button>

        <button
            id="lineFinishBtn"
            class="line-editor-btn line-editor-ok">
            ✓ 完了
        </button>

        <button
            id="lineCancelBtn"
            class="line-editor-btn line-editor-cancel">
            × キャンセル
        </button>

    </div>


    <!-- =====================================================
         MODE BAR
    ====================================================== -->

    <div class="modebar">

        <button
            class="mode-btn active"
            data-mode="select">
            選択
        </button>

        <button
            class="mode-btn"
            data-mode="point">
            📍 地点
        </button>

        <button
            class="mode-btn"
            data-mode="line">
            ━ 線
        </button>

        <button
            class="mode-btn"
            data-mode="delete">
            🗑️ 削除
        </button>

    </div>

</div>


<!-- =========================================================
     POINT MODAL
========================================================== -->

<div id="pointModal" class="modal-backdrop">

    <div class="modal">

        <div class="modal-title">
            地点を編集
        </div>

        <div class="field">

            <label for="pointTime">
                時刻
            </label>

            <input
                id="pointTime"
                type="time">

        </div>

        <div class="field">

            <label for="pointPlace">
                場所
            </label>

            <input
                id="pointPlace"
                type="text"
                placeholder="例：学校、交差点、コンビニ">

        </div>

        <div class="modal-actions">

            <button
                id="pointCancelBtn"
                class="action-btn btn-cancel">
                キャンセル
            </button>

            <button
                id="pointDeleteBtn"
                class="action-btn btn-delete">
                削除
            </button>

            <button
                id="pointSaveBtn"
                class="action-btn btn-save">
                保存
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     LINE MODAL
========================================================== -->

<div id="lineModal" class="modal-backdrop">

    <div class="modal">

        <div class="modal-title">
            線を編集
        </div>

        <div class="field">

            <label>
                線の色
            </label>

            <div class="color-row">

                <button
                    class="color-choice"
                    data-color="#1d74f5"
                    style="background:#1d74f5"></button>

                <button
                    class="color-choice"
                    data-color="#22a06b"
                    style="background:#22a06b"></button>

                <button
                    class="color-choice"
                    data-color="#f59e0b"
                    style="background:#f59e0b"></button>

                <button
                    class="color-choice"
                    data-color="#ef4444"
                    style="background:#ef4444"></button>

                <button
                    class="color-choice"
                    data-color="#8b5cf6"
                    style="background:#8b5cf6"></button>

                <button
                    class="color-choice"
                    data-color="#6b7280"
                    style="background:#6b7280"></button>

            </div>

        </div>

        <div class="field">

            <label>
                線の太さ
            </label>

            <div class="width-row">

                <button
                    class="width-choice"
                    data-width="3">
                    細い
                </button>

                <button

<!-- =========================================================

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<script>
/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY = "route-reconstruction-data-v3";


/* =========================================================
   MAP
========================================================= */

const map = L.map("map",{
    zoomControl:true,
    preferCanvas:true
}).setView([32.85,129.85],13);


/* =========================================================
   TILE LAYERS
========================================================= */

const normalLayer = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        crossOrigin:true,
        attribution:"&copy; OpenStreetMap contributors"
    }
);

const satelliteLayer = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        maxZoom:19,
        crossOrigin:true,
        attribution:"Tiles &copy; Esri"
    }
);

normalLayer.addTo(map);

let satelliteMode = false;

L.control.scale({
    imperial:false,
    metric:true,
    position:"bottomright",
    maxWidth:120
}).addTo(map);


/* =========================================================
   DATA
========================================================= */

let points = [];
let lines = [];


/* =========================================================
   STATE
========================================================= */

let currentMode = "select";

let currentPointId = null;
let currentLineId = null;

let lineDrawing = false;
let temporaryLineCoords = [];
let temporaryLine = null;

const pointLayers = new Map();
const lineLayers = new Map();
const arrowLayers = new Map();


/* =========================================================
   UTIL
========================================================= */

function createId(){

    return (
        Date.now().toString(36) +
        Math.random().toString(36).slice(2,8)
    );

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function normalizeData(raw){

    const data = raw && typeof raw === "object"
        ? raw
        : {};

    return {

        version:5,

        type:"route-reconstruction",

        createdAt:
            data.createdAt ||
            new Date().toISOString(),

        note:
            "手動で配置・再構成したルートデータです。過去GPSログではありません。",

        points:
            Array.isArray(data.points)
            ? data.points.map(p => ({
                id:p.id || createId(),
                lat:Number(p.lat),
                lng:Number(p.lng),
                time:p.time || "",
                place:p.place || ""
            })).filter(p =>
                Number.isFinite(p.lat) &&
                Number.isFinite(p.lng)
            )
            : [],

        lines:
            Array.isArray(data.lines)
            ? data.lines.map(l => ({
                id:l.id || createId(),
                color:l.color || "#1d74f5",
                width:Number(l.width) || 5,
                coords:Array.isArray(l.coords)
                    ? l.coords
                        .map(c => [
                            Number(c[0]),
                            Number(c[1])
                        ])
                        .filter(c =>
                            Number.isFinite(c[0]) &&
                            Number.isFinite(c[1])
                        )
                    : []
            })).filter(l =>
                l.coords.length >= 2
            )
            : []

    };

}


function getCurrentData(){

    return normalizeData({

        version:5,

        type:"route-reconstruction",

        createdAt:
            new Date().toISOString(),

        note:
            "手動で配置・再構成したルートデータです。過去GPSログではありません。",

        points,

        lines

    });

}


function getCurrentJson(){

    return JSON.stringify(
        getCurrentData(),
        null,
        2
    );

}


function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        getCurrentJson()
    );

}


function loadData(){

    try{

        const raw =
            localStorage.getItem(STORAGE_KEY);

        if(!raw){

            points = [];
            lines = [];

            return;
        }

        const data =
            normalizeData(JSON.parse(raw));

        points = data.points;
        lines = data.lines;

    }catch(error){

        console.error(error);

        points = [];
        lines = [];

    }

}


/* =========================================================
   HELP
========================================================= */

let helpTimer = null;

function showHelp(message){

    const pill =
        document.getElementById("helpPill");

    pill.textContent = message;
    pill.classList.add("show");

    clearTimeout(helpTimer);

    helpTimer = setTimeout(() => {

        pill.classList.remove("show");

    },2600);

}


/* =========================================================
   POINT ICON
========================================================= */

function createPointIcon(){

    return L.divIcon({

        className:"",

        html:
            '<div class="route-point-icon"></div>',

        iconSize:[30,30],

        iconAnchor:[15,15]

    });

}


/* =========================================================
   ARROW ICON
========================================================= */

function createArrowIcon(
    color,
    angle
){

    const html = `
        <div
            class="route-arrow"
            style="
                border-bottom-color:${color};
                transform:rotate(${angle}deg);
            ">
        </div>
    `;

    return L.divIcon({

        className:"",

        html,

        iconSize:[20,20],

        iconAnchor:[10,10]

    });

}


/* =========================================================
   CREATE ARROWS ON MAP
========================================================= */

function createLineArrows(line){

    const group = L.layerGroup();

    if(!line.coords || line.coords.length < 2){
        return group;
    }

    const coords = line.coords;

    let totalDistance = 0;

    const distances = [];

    for(let i=0;i<coords.length-1;i++){

        const a =
            L.latLng(
                coords[i][0],
                coords[i][1]
            );

        const b =
            L.latLng(
                coords[i+1][0],
                coords[i+1][1]
            );

        const d =
            map.distance(a,b);

        distances.push(d);

        totalDistance += d;

    }

    if(totalDistance <= 0){
        return group;
    }

    const arrowCount =
        Math.max(
            1,
            Math.min(
                10,
                Math.floor(totalDistance / 120)
            )
        );

    for(let n=1;n<=arrowCount;n++){

        const target =
            totalDistance *
            n /
            (arrowCount + 1);

        let accumulated = 0;

        for(let i=0;i<distances.length;i++){

            const segment =
                distances[i];

            if(
                accumulated + segment >=
                target
            ){

                const ratio =
                    (target - accumulated) /
                    segment;

                const lat =
                    coords[i][0] +
                    (
                        coords[i+1][0] -
                        coords[i][0]
                    ) *
                    ratio;

                const lng =
                    coords[i][1] +
                    (
                        coords[i+1][1] -
                        coords[i][1]
                    ) *
                    ratio;

                const p1 =
                    map.latLngToLayerPoint(
                        L.latLng(
                            coords[i][0],
                            coords[i][1]
                        )
                    );

                const p2 =
                    map.latLngToLayerPoint(
                        L.latLng(
                            coords[i+1][0],
                            coords[i+1][1]
                        )
                    );

                const angle =
                    Math.atan2(
                        p2.y-p1.y,
                        p2.x-p1.x
                    ) *
                    180 /
                    Math.PI +
                    90;

                L.marker(
                    [lat,lng],
                    {
                        icon:
                            createArrowIcon(
                                line.color,
                                angle
                            ),
                        interactive:false,
                        keyboard:false,
                        zIndexOffset:-10
                    }
                ).addTo(group);

                break;
            }

            accumulated += segment;
        }

    }

    return group;

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    /* remove point layers */

    pointLayers.forEach(layer => {

        map.removeLayer(layer);

    });

    pointLayers.clear();


    /* remove line layers */

    lineLayers.forEach(layer => {

        map.removeLayer(layer);

    });

    lineLayers.clear();


    /* remove arrows */

    arrowLayers.forEach(group => {

        map.removeLayer(group);

    });

    arrowLayers.clear();


    /* points */

    points.forEach(point => {

        const marker =
            L.marker(
                [point.lat,point.lng],
                {
                    draggable:
                        currentMode === "select",
                    icon:createPointIcon()
                }
            );

        marker.addTo(map);

        marker.on("click",function(e){

            L.DomEvent.stopPropagation(e);

            if(currentMode === "delete"){

                deletePointById(point.id);

                return;
            }

            openPointModal(point.id);

        });


        marker.on("dragend",function(){

            if(currentMode !== "select"){

                return;

            }

            const pos =
                marker.getLatLng();

            const target =
                points.find(
                    p => p.id === point.id
                );

            if(!target){

                return;
            }

            target.lat = pos.lat;
            target.lng = pos.lng;

            saveData();

            render();

        });


        pointLayers.set(
            point.id,
            marker
        );

    });


    /* lines */

    lines.forEach(line => {

        const polyline =
            L.polyline(
                line.coords,
                {
                    color:line.color,
                    weight:line.width,
                    opacity:.92,
                    lineCap:"round",
                    lineJoin:"round"
                }
            );

        polyline.addTo(map);

        polyline.on("click",function(e){

            L.DomEvent.stopPropagation(e);

            if(currentMode === "delete"){

                deleteLineById(line.id);

                return;
            }

            openLineModal(line.id);

        });

        lineLayers.set(
            line.id,
            polyline
        );


        const arrows =
            createLineArrows(line);

        arrows.addTo(map);

        arrowLayers.set(
            line.id,
            arrows
        );

    });

}


/* =========================================================
   MODE
========================================================= */

function setMode(mode){

    if(lineDrawing && mode !== "line"){

        cancelLineDrawing();

    }

    currentMode = mode;

    document
        .querySelectorAll(".mode-btn")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                btn.dataset.mode === mode
            );

        });


    if(mode === "select"){

        showHelp(
            "地点をドラッグして自由に移動できます"
        );

    }else if(mode === "point"){

        showHelp(
            "地図をタップして地点を追加"
        );

    }else if(mode === "line"){

        showHelp(
            "地図を順番にタップして線を描きます"
        );

    }else if(mode === "delete"){

        showHelp(
            "地点または線をタップして削除"
        );

    }

    render();

}


document
    .querySelectorAll(".mode-btn")
    .forEach(btn => {

        btn.addEventListener(
            "click",
            () => setMode(btn.dataset.mode)
        );

    });


/* =========================================================
   MAP CLICK
========================================================= */

map.on("click",function(e){

    if(currentMode === "point"){

        createPoint(
            e.latlng.lat,
            e.latlng.lng
        );

        return;

    }

    if(currentMode === "line"){

        if(!lineDrawing){

            startLineDrawing();

        }

        temporaryLineCoords.push([
            e.latlng.lat,
            e.latlng.lng
        ]);

        updateTemporaryLine();

        return;

    }

});


/* =========================================================
   POINT CREATE
========================================================= */

function createPoint(lat,lng){

    const point = {

        id:createId(),

        lat:Number(lat),

        lng:Number(lng),

        time:"",

        place:""

    };

    points.push(point);

    saveData();

    render();

    openPointModal(point.id);

}


/* =========================================================
   POINT MODAL
========================================================= */

const pointModal =
    document.getElementById("pointModal");

const pointTime =
    document.getElementById("pointTime");

const pointPlace =
    document.getElementById("pointPlace");


function openPointModal(id){

    const point =
        points.find(
            p => p.id === id
        );

    if(!point){

        return;

    }

    currentPointId = id;

    pointTime.value =
        point.time || "";

    pointPlace.value =
        point.place || "";

    pointModal.classList.add("show");

}


function closePointModal(){

    pointModal.classList.remove("show");

    currentPointId = null;

}


document
    .getElementById("pointCancelBtn")
    .addEventListener(
        "click",
        closePointModal
    );


document
    .getElementById("pointSaveBtn")
    .addEventListener(
        "click",
        () => {

            if(!currentPointId){

                return;

            }

            const point =
                points.find(
                    p => p.id === currentPointId
                );

            if(!point){

                closePointModal();

                return;

            }

            point.time =
                pointTime.value.trim();

            point.place =
                pointPlace.value.trim();

            saveData();

            closePointModal();

            render();

        }
    );


/* =========================================================
   POINT DELETE
========================================================= */

function deletePointById(id){

    const index =
        points.findIndex(
            p => p.id === id
        );

    if(index === -1){

        return;

    }

    points.splice(index,1);

    saveData();

    closePointModal();

    render();

    showHelp("地点を削除しました");

}


document
    .getElementById("pointDeleteBtn")
    .addEventListener(
        "click",
        () => {

            if(currentPointId){

                deletePointById(
                    currentPointId
                );

            }

        }
    );


/* =========================================================
   LINE DRAWING
========================================================= */

function startLineDrawing(){

    lineDrawing = true;

    temporaryLineCoords = [];

    temporaryLine =
        L.polyline(
            [],
            {
                color:"#1d74f5",
                weight:5,
                opacity:.65,
                dashArray:"8 8",
                lineCap:"round",
                lineJoin:"round"
            }
        ).addTo(map);

    document
        .getElementById("lineEditor")
        .classList.add("show");

}


function updateTemporaryLine(){

    if(!temporaryLine){

        return;

    }

    temporaryLine.setLatLngs(
        temporaryLineCoords
    );

}


function undoLinePoint(){

    if(!lineDrawing){

        return;

    }

    temporaryLineCoords.pop();

    updateTemporaryLine();

}


function finishLineDrawing(){

    if(!lineDrawing){

        return;

    }

    if(temporaryLineCoords.length < 2){

        showHelp(
            "線を作るには2点以上必要です"
        );

        return;

    }

    const line = {

        id:createId(),

        color:"#1d74f5",

        width:5,

        coords:
            temporaryLineCoords.map(
                c => [c[0],c[1]]
            )

    };

    lines.push(line);

    cancelLineDrawing();

    saveData();

    render();

    openLineModal(line.id);

}


function cancelLineDrawing(){

    if(temporaryLine){

        map.removeLayer(
            temporaryLine
        );

    }

    temporaryLine = null;

    temporaryLineCoords = [];

    lineDrawing = false;

    document
        .getElementById("lineEditor")
        .classList.remove("show");

}


document
    .getElementById("lineUndoBtn")
    .addEventListener(
        "click",
        undoLinePoint
    );


document
    .getElementById("lineFinishBtn")
    .addEventListener(
        "click",
        finishLineDrawing
    );


document
    .getElementById("lineCancelBtn")
    .addEventListener(
        "click",
        cancelLineDrawing
    );


/* =========================================================
   LINE MODAL
========================================================= */

const lineModal =
    document.getElementById("lineModal");


let editingLineColor = "#1d74f5";
let editingLineWidth = 5;


function openLineModal(id){

    const line =
        lines.find(
            l => l.id === id
        );

    if(!line){

        return;

    }

    currentLineId = id;

    editingLineColor =
        line.color || "#1d74f5";

    editingLineWidth =
        Number(line.width) || 5;

    updateLineModalUI();

    lineModal.classList.add("show");

}


function closeLineModal(){

    lineModal.classList.remove("show");

    currentLineId = null;

}


function updateLineModalUI(){

    document
        .querySelectorAll(".color-choice")
        .forEach(btn => {

            btn.classList.toggle(
                "selected",
                btn.dataset.color ===
                editingLineColor
            );

        });


    document
        .querySelectorAll(".width-choice")
        .forEach(btn => {

            btn.classList.toggle(
                "selected",
                Number(btn.dataset.width) ===
                Number(editingLineWidth)
            );

        });

}


document
    .querySelectorAll(".color-choice")
    .forEach(btn => {

        btn.addEventListener(
            "click",
            () => {

                editingLineColor =
                    btn.dataset.color;

                updateLineModalUI();

            }
        );

    });


document
    .querySelectorAll(".width-choice")
    .forEach(btn => {

        btn.addEventListener(
            "click",
            () => {

                editingLineWidth =
                    Number(
                        btn.dataset.width
                    );

                updateLineModalUI();

            }
        );

    });


document
    .getElementById("lineCancelEditBtn")
    .addEventListener(
        "click",
        closeLineModal
    );


document
    .getElementById("lineSaveBtn")
    .addEventListener(
        "click",
        () => {

            if(!currentLineId){

                return;

            }

            const line =
                lines.find(
                    l => l.id === currentLineId
                );

            if(!line){

                closeLineModal();

                return;

            }

            line.color =
                editingLineColor;

            line.width =
                editingLineWidth;

            saveData();

            closeLineModal();

            render();

        }
    );


/* =========================================================
   LINE DELETE
========================================================= */

function deleteLineById(id){

    const index =
        lines.findIndex(
            l => l.id === id
        );

    if(index === -1){

        return;

    }

    lines.splice(index,1);

    saveData();

    closeLineModal();

    render();

    showHelp("線を削除しました");

}


document
    .getElementById("lineDeleteBtn")
    .addEventListener(
        "click",
        () => {

            if(currentLineId){

                deleteLineById(
                    currentLineId
                );

            }

        }
    );


/* =========================================================
   SATELLITE
========================================================= */

function toggleSatellite(){

    if(satelliteMode){

        map.removeLayer(
            satelliteLayer
        );

        normalLayer.addTo(map);

        satelliteMode = false;

    }else{

        map.removeLayer(
            normalLayer
        );

        satelliteLayer.addTo(map);

        satelliteMode = true;

    }

    document
        .getElementById("satelliteBtn")
        .classList.toggle(
            "active",
            satelliteMode
        );

}


document
    .getElementById("satelliteBtn")
    .addEventListener(
        "click",
        toggleSatellite
    );

/* =========================================================
   COPY JSON
========================================================= */

async function copyText(text){

    try{

        await navigator.clipboard.writeText(
            text
        );

        showHelp(
            "コピーしました"
        );

    }catch(error){

        const textarea =
            document.createElement("textarea");

        textarea.value = text;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();

        showHelp(
            "コピーしました"
        );

    }

}

/* =========================================================
   JSON DOWNLOAD
========================================================= */

function downloadBlob(
    blob,
    filename
){

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download = filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        () => URL.revokeObjectURL(url),
        3000
    );

}


function downloadJson(){

    const blob =
        new Blob(
            [getCurrentJson()],
            {
                type:
                    "application/json;charset=utf-8"
            }
        );

    downloadBlob(
        blob,
        "route-reconstruction.json"
    );

    showHelp(
        "JSONを保存しました"
    );

}

/* =========================================================
   WEB MERCATOR
========================================================= */

const TILE_SIZE = 256;

const MAX_CANVAS_DIM = 14000;

const MAX_CANVAS_PIXELS =
    70000000;

const MAX_LAT =
    85.05112878;


function clampLat(lat){

    return Math.max(
        -MAX_LAT,
        Math.min(
            MAX_LAT,
            lat
        )
    );

}


function latLngToWorldPixel(
    lat,
    lng,
    zoom
){

    const worldSize =
        TILE_SIZE *
        Math.pow(
            2,
            zoom
        );

    const latitude =
        clampLat(lat);

    const sin =
        Math.sin(
            latitude *
            Math.PI /
            180
        );

    const x =
        (
            lng + 180
        ) /
        360 *
        worldSize;

    const y =
        (
            0.5 -
            Math.log(
                (
                    1 + sin
                ) /
                (
                    1 - sin
                )
            ) /
            (
                4 * Math.PI
            )
        ) *
        worldSize;

    return {
        x,
        y
    };

}


/* =========================================================
   GET ALL COORDINATES
========================================================= */

function getAllCoordinates(){

    const coords = [];

    points.forEach(
        p => {

            coords.push([
                p.lat,
                p.lng
            ]);

        }
    );

    lines.forEach(
        line => {

            line.coords.forEach(
                c => {

                    coords.push([
                        c[0],
                        c[1]
                    ]);

                }
            );

        }
    );

    return coords;

}


/* =========================================================
   EXPORT BOUNDS
========================================================= */

function getExportBounds(
    zoom
){

    const coords =
        getAllCoordinates();

    if(coords.length === 0){

        const center =
            map.getCenter();

        const p =
            latLngToWorldPixel(
                center.lat,
                center.lng,
                zoom
            );

        return {

            minX:p.x - 400,

            maxX:p.x + 400,

            minY:p.y - 400,

            maxY:p.y + 400

        };

    }


    let minX = Infinity;
    let maxX = -Infinity;
    let minY = Infinity;
    let maxY = -Infinity;


    coords.forEach(
        c => {

            const p =
                latLngToWorldPixel(
                    c[0],
                    c[1],
                    zoom
                );

            minX =
                Math.min(
                    minX,
                    p.x
                );

            maxX =
                Math.max(
                    maxX,
                    p.x
                );

            minY =
                Math.min(
                    minY,
                    p.y
                );

            maxY =
                Math.max(
                    maxY,
                    p.y
                );

        }
    );


    const padding = 180;

    minX -= padding;
    maxX += padding;
    minY -= padding;
    maxY += padding;


    const width =
        maxX - minX;

    const height =
        maxY - minY;


    if(width < 900){

        const extra =
            (900 - width) / 2;

        minX -= extra;
        maxX += extra;

    }


    if(height < 700){

        const extra =
            (700 - height) / 2;

        minY -= extra;
        maxY += extra;

    }


    return {
        minX,
        maxX,
        minY,
        maxY
    };

}


/* =========================================================
   FIND SAFE ZOOM
========================================================= */

function getSafeExportZoom(
    requestedZoom
){

    let zoom =
        Number(requestedZoom);

    while(zoom >= 14){

        const bounds =
            getExportBounds(
                zoom
            );

        const width =
            Math.ceil(
                bounds.maxX -
                bounds.minX
            );

        const height =
            Math.ceil(
                bounds.maxY -
                bounds.minY
            );

        const pixels =
            width *
            height;


        if(
            width <= MAX_CANVAS_DIM &&
            height <= MAX_CANVAS_DIM &&
            pixels <= MAX_CANVAS_PIXELS
        ){

            return {
                zoom,
                bounds,
                width,
                height
            };

        }

        zoom--;

    }


    const bounds =
        getExportBounds(14);

    return {

        zoom:14,

        bounds,

        width:Math.ceil(
            bounds.maxX -
            bounds.minX
        ),

        height:Math.ceil(
            bounds.maxY -
            bounds.minY
        )

    };

}


/* =========================================================
   TILE URL
========================================================= */

function getTileUrl(
    type,
    z,
    x,
    y
){

    const n =
        Math.pow(
            2,
            z
        );

    let wrappedX =
        (
            x % n +
            n
        ) %
        n;


    if(
        y < 0 ||
        y >= n
    ){

        return null;

    }


    if(type === "satellite"){

        return (
            "https://server.arcgisonline.com/" +
            "ArcGIS/rest/services/" +
            "World_Imagery/MapServer/tile/" +
            z +
            "/" +
            y +
            "/" +
            wrappedX
        );

    }


    const subdomains =
        ["a","b","c"];

    const sub =
        subdomains[
            Math.abs(
                x + y
            ) %
            subdomains.length
        ];

    return (
        "https://" +
        sub +
        ".tile.openstreetmap.org/" +
        z +
        "/" +
        wrappedX +
        "/" +
        y +
        ".png"
    );

}


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImage(
    url
){

    return new Promise(
        (resolve,reject) => {

            const img =
                new Image();

            img.crossOrigin =
                "anonymous";

            img.onload =
                () => resolve(img);

            img.onerror =
                () =>
                    reject(
                        new Error(
                            "画像読み込み失敗: " +
                            url
                        )
                    );

            img.src = url;

        }
    );

}


/* =========================================================
   CONCURRENCY QUEUE
========================================================= */

async function runConcurrent(
    items,
    worker,
    concurrency = 6
){

    let index = 0;

    const results =
        new Array(
            items.length
        );


    async function runner(){

        while(true){

            const current =
                index++;

            if(
                current >=
                items.length
            ){

                return;

            }

            try{

                results[current] =
                    await worker(
                        items[current],
                        current
                    );

            }catch(error){

                results[current] =
                    {
                        error
                    };

            }

        }

    }


    const runners = [];

    for(
        let i=0;
        i<Math.min(
            concurrency,
            items.length
        );
        i++
    ){

        runners.push(
            runner()
        );

    }


    await Promise.all(
        runners
    );


    return results;

}


/* =========================================================
   LOAD TILES TO CANVAS
========================================================= */

async function drawTilesToCanvas(
    ctx,
    bounds,
    zoom,
    type
){

    const startTileX =
        Math.floor(
            bounds.minX /
            TILE_SIZE
        );

    const endTileX =
        Math.floor(
            (
                bounds.maxX
            ) /
            TILE_SIZE
        );

    const startTileY =
        Math.floor(
            bounds.minY /
            TILE_SIZE
        );

    const endTileY =
        Math.floor(
            (
                bounds.maxY
            ) /
            TILE_SIZE
        );


    const tiles = [];


    for(
        let y=startTileY;
        y<=endTileY;
        y++
    ){

        for(
            let x=startTileX;
            x<=endTileX;
            x++
        ){

            tiles.push({
                x,
                y
            });

        }

    }


    const total =
        tiles.length;

    let completed = 0;


    const results =
        await runConcurrent(
            tiles,
            async tile => {

                const url =
                    getTileUrl(
                        type,
                        zoom,
                        tile.x,
                        tile.y
                    );

                if(!url){

                    completed++;

                    return;

                }

                try{

                    const img =
                        await loadImage(
                            url
                        );

                    const drawX =
                        tile.x *
                        TILE_SIZE -
                        bounds.minX;

                    const drawY =
                        tile.y *
                        TILE_SIZE -
                        bounds.minY;


                    ctx.drawImage(
                        img,
                        Math.round(drawX),
                        Math.round(drawY),
                        TILE_SIZE,
                        TILE_SIZE
                    );

                }catch(error){

                    console.warn(
                        "Tile failed",
                        url
                    );

                }


                completed++;

                setProgress(
                    5 +
                    (
                        completed /
                        total
                    ) *
                    55,
                    "地図タイルをCanvasへ描画中… " +
                    completed +
                    " / " +
                    total
                );

            },
            6
        );

    return results;

}


/* =========================================================
   EXPORT COORDINATE
========================================================= */

function exportPoint(
    lat,
    lng,
    zoom,
    bounds
){

    const p =
        latLngToWorldPixel(
            lat,
            lng,
            zoom
        );

    return {

        x:
            p.x -
            bounds.minX,

        y:
            p.y -
            bounds.minY

    };

}


/* =========================================================
   DRAW LINE
========================================================= */

function drawCanvasLine(
    ctx,
    coords,
    color,
    width,
    zoom,
    bounds
){

    if(
        !coords ||
        coords.length < 2
    ){

        return;

    }

    ctx.save();

    ctx.beginPath();

    const first =
        exportPoint(
            coords[0][0],
            coords[0][1],
            zoom,
            bounds
        );

    ctx.moveTo(
        first.x,
        first.y
    );


    for(
        let i=1;
        i<coords.length;
        i++
    ){

        const p =
            exportPoint(
                coords[i][0],
                coords[i][1],
                zoom,
                bounds
            );

        ctx.lineTo(
            p.x,
            p.y
        );

    }


    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        width;

    ctx.shadowColor =
        "rgba(0,0,0,.22)";

    ctx.shadowBlur =
        2;

    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   DISTANCE
========================================================= */

function coordinateDistanceMeters(
    a,
    b
){

    const R =
        6371000;

    const lat1 =
        a[0] *
        Math.PI /
        180;

    const lat2 =
        b[0] *
        Math.PI /
        180;

    const dLat =
        (
            b[0] -
            a[0]
        ) *
        Math.PI /
        180;

    const dLng =
        (
            b[1] -
            a[1]
        ) *
        Math.PI /
        180;


    const h =
        Math.sin(
            dLat / 2
        ) ** 2 +
        Math.cos(lat1) *
        Math.cos(lat2) *
        Math.sin(
            dLng / 2
        ) ** 2;


    return (
        2 *
        R *
        Math.asin(
            Math.sqrt(h)
        )
    );

}


/* =========================================================
   DRAW ARROWS ON CANVAS
========================================================= */

function drawCanvasArrows(
    ctx,
    line,
    zoom,
    bounds
){

    if(
        !line.coords ||
        line.coords.length < 2
    ){

        return;

    }


    const coords =
        line.coords;

    const segmentDistances = [];

    let totalDistance = 0;


    for(
        let i=0;
        i<coords.length-1;
        i++
    ){

        const d =
            coordinateDistanceMeters(
                coords[i],
                coords[i+1]
            );

        segmentDistances.push(d);

        totalDistance += d;

    }


    if(
        totalDistance <= 0
    ){

        return;

    }


    const count =
        Math.max(
            1,
            Math.min(
                12,
                Math.floor(
                    totalDistance /
                    120
                )
            )
        );


    for(
        let n=1;
        n<=count;
        n++
    ){

        const target =
            totalDistance *
            n /
            (count + 1);

        let accumulated = 0;


        for(
            let i=0;
            i<segmentDistances.length;
            i++
        ){

            const d =
                segmentDistances[i];


            if(
                accumulated + d >=
                target
            ){

                const ratio =
                    (
                        target -
                        accumulated
                    ) /
                    d;


                const lat =
                    coords[i][0] +
                    (
                        coords[i+1][0] -
                        coords[i][0]
                    ) *
                    ratio;


                const lng =
                    coords[i][1] +
                    (
                        coords[i+1][1] -
                        coords[i][1]
                    ) *
                    ratio;


                const p =
                    exportPoint(
                        lat,
                        lng,
                        zoom,
                        bounds
                    );


                const p1 =
                    exportPoint(
                        coords[i][0],
                        coords[i][1],
                        zoom,
                        bounds
                    );

                const p2 =
                    exportPoint(
                        coords[i+1][0],
                        coords[i+1][1],
                        zoom,
                        bounds
                    );


                const angle =
                    Math.atan2(
                        p2.y-p1.y,
                        p2.x-p1.x
                    );


                drawCanvasArrow(
                    ctx,
                    p.x,
                    p.y,
                    angle,
                    line.color
                );


                break;

            }


            accumulated += d;

        }

    }

}


/* =========================================================
   DRAW SINGLE ARROW
========================================================= */

function drawCanvasArrow(
    ctx,
    x,
    y,
    angle,
    color
){

    const size = 10;

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        angle
    );


    ctx.beginPath();

    ctx.moveTo(
        size,
        0
    );

    ctx.lineTo(
        -size * .75,
        -size * .65
    );

    ctx.lineTo(
        -size * .45,
        0
    );

    ctx.lineTo(
        -size * .75,
        size * .65
    );

    ctx.closePath();


    ctx.fillStyle =
        "rgba(255,255,255,.9)";

    ctx.shadowColor =
        "rgba(0,0,0,.25)";

    ctx.shadowBlur =
        3;

    ctx.fill();


    ctx.shadowBlur = 0;

    ctx.beginPath();

    ctx.moveTo(
        size - 1,
        0
    );

    ctx.lineTo(
        -size * .72,
        -size * .52
    );

    ctx.lineTo(
        -size * .42,
        0
    );

    ctx.lineTo(
        -size * .72,
        size * .52
    );

    ctx.closePath();


    ctx.fillStyle =
        color;

    ctx.fill();

    ctx.restore();

}


/* =========================================================
   DRAW POINT
========================================================= */

function drawCanvasPoint(
    ctx,
    point,
    zoom,
    bounds
){

    const p =
        exportPoint(
            point.lat,
            point.lng,
            zoom,
            bounds
        );


    /* shadow */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        10,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.22)";

    ctx.fill();

    ctx.restore();


    /* white outer circle */

    ctx.save();

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        9,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "white";

    ctx.fill();


    ctx.strokeStyle =
        "#1d74f5";

    ctx.lineWidth =
        4;

    ctx.stroke();

    ctx.restore();


    /* label */

    const time =
        point.time || "";

    const place =
        point.place || "";


    if(
        !time &&
        !place
    ){

        return;

    }


    const labelParts = [];

    if(time){

        labelParts.push(
            time
        );

    }

    if(place){

        labelParts.push(
            place
        );

    }


    const label =
        labelParts.join(
            "  "
        );


    ctx.save();


    ctx.font =
        "bold 22px -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Yu Gothic', sans-serif";


    const textWidth =
        ctx.measureText(
            label
        ).width;


    const paddingX = 11;
    const paddingY = 7;

    const boxWidth =
        textWidth +
        paddingX * 2;

    const boxHeight =
        36 +
        paddingY;


    const boxX =
        p.x + 16;

    const boxY =
        p.y - 18;


    /* keep label inside canvas */

    let finalX =
        boxX;

    let finalY =
        boxY;


    if(
        finalX +
        boxWidth >
        ctx.canvas.width -
        10
    ){

        finalX =
            p.x -
            boxWidth -
            16;

    }


    if(finalY < 10){

        finalY = 10;

    }

    if(
        finalY +
        boxHeight >
        ctx.canvas.height -
        10
    ){

        finalY =
            ctx.canvas.height -
            boxHeight -
            10;

    }


    roundRect(
        ctx,
        finalX,
        finalY,
        boxWidth,
        boxHeight,
        10
    );


    ctx.fillStyle =
        "rgba(255,255,255,.96)";

    ctx.shadowColor =
        "rgba(0,0,0,.20)";

    ctx.shadowBlur =
        8;

    ctx.fill();


    ctx.shadowBlur = 0;

    ctx.strokeStyle =
        "rgba(215,221,230,.95)";

    ctx.lineWidth = 1;

    ctx.stroke();


    ctx.fillStyle =
        "#172033";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        label,
        finalX + paddingX,
        finalY +
        boxHeight / 2
    );


    ctx.restore();

}


/* =========================================================
   ROUND RECT
========================================================= */

function roundRect(
    ctx,
    x,
    y,
    width,
    height,
    radius
){

    const r =
        Math.min(
            radius,
            width / 2,
            height / 2
        );

    ctx.beginPath();

    ctx.moveTo(
        x+r,
        y
    );

    ctx.arcTo(
        x+width,
        y,
        x+width,
        y+height,
        r
    );

    ctx.arcTo(
        x+width,
        y+height,
        x,
        y+height,
        r
    );

    ctx.arcTo(
        x,
        y+height,
        x,
        y,
        r
    );

    ctx.arcTo(
        x,
        y,
        x+width,
        y,
        r
    );

    ctx.closePath();

}


/* =========================================================
   SCALE BAR
========================================================= */

function metersPerPixel(
    lat,
    zoom
){

    return (
        156543.03392 *
        Math.cos(
            lat *
            Math.PI /
            180
        ) /
        Math.pow(
            2,
            zoom
        )
    );

}


function niceScaleDistance(
    meters
){

    const values = [
        1,
        2,
        5
    ];

    const exponent =
        Math.floor(
            Math.log10(
                meters
            )
        );

    const base =
        Math.pow(
            10,
            exponent
        );

    const normalized =
        meters /
        base;

    let value = 1;

    if(normalized >= 5){

        value = 5;

    }else if(normalized >= 2){

        value = 2;

    }

    return value * base;

}


function drawScaleBar(
    ctx,
    zoom,
    bounds
){

    const centerY =
        (
            bounds.minY +
            bounds.maxY
        ) / 2;

    const centerX =
        (
            bounds.minX +
            bounds.maxX
        ) / 2;


    const centerLat =
        worldPixelToLatLng(
            centerX,
            centerY,
            zoom
        ).lat;


    const mpp =
        metersPerPixel(
            centerLat,
            zoom
        );


    const targetPixels = 180;

    const targetMeters =
        targetPixels *
        mpp;

    const distance =
        niceScaleDistance(
            targetMeters
        );


    const pixels =
        distance /
        mpp;


    const x =
        35;

    const y =
        ctx.canvas.height -
        45;


    ctx.save();


    ctx.strokeStyle =
        "#111827";

    ctx.fillStyle =
        "rgba(255,255,255,.88)";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(
        x,
        y
    );

    ctx.lineTo(
        x + pixels,
        y
    );

    ctx.stroke();


    ctx.lineWidth = 2;

    ctx.strokeStyle =
        "#111827";

    ctx.beginPath();

    ctx.moveTo(
        x,
        y - 7
    );

    ctx.lineTo(
        x,
        y + 7
    );

    ctx.moveTo(
        x + pixels,
        y - 7
    );

    ctx.lineTo(
        x + pixels,
        y + 7
    );

    ctx.stroke();


    ctx.font =
        "bold 18px -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif";

    ctx.textBaseline =
        "bottom";

    const text =
        distance >= 1000
            ? (
                (
                    distance /
                    1000
                ).toFixed(
                    distance % 1000 === 0
                        ? 0
                        : 1
                ) +
                " km"
            )
            : (
                Math.round(
                    distance
                ) +
                " m"
            );


    ctx.fillStyle =
        "#111827";

    ctx.fillText(
        text,
        x,
        y - 10
    );


    ctx.restore();

}


/* =========================================================
   WORLD PIXEL TO LAT LNG
========================================================= */

function worldPixelToLatLng(
    x,
    y,
    zoom
){

    const worldSize =
        TILE_SIZE *
        Math.pow(
            2,
            zoom
        );


    const lng =
        x /
        worldSize *
        360 -
        180;


    const n =
        Math.PI -
        2 *
        Math.PI *
        y /
        worldSize;


    const lat =
        180 /
        Math.PI *
        Math.atan(
            Math.sinh(n)
        );


    return {
        lat,
        lng
    };

}

/* =========================================================
   BUILD EXPORT CANVAS
========================================================= */

async function buildExportCanvas(
    requestedZoom,
    mapType
){

    const safe =
        getSafeExportZoom(
            requestedZoom
        );


    setProgress(
        2,
        "出力サイズを計算しています…"
    );


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        safe.width;

    canvas.height =
        safe.height;


    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha:false
            }
        );


    if(!ctx){

        throw new Error(
            "Canvasを作成できませんでした。"
        );

    }


    /* background */

    ctx.fillStyle =
        "#e9edf2";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* tiles */

    await drawTilesToCanvas(
        ctx,
        safe.bounds,
        safe.zoom,
        mapType
    );


    /* vector objects */

    setProgress(
        63,
        "線・矢印・地点を描画しています…"
    );


    /* lines */

    lines.forEach(
        line => {

            drawCanvasLine(
                ctx,
                line.coords,
                line.color,
                line.width,
                safe.zoom,
                safe.bounds
            );

        }
    );


    /* arrows */

    lines.forEach(
        line => {

            drawCanvasArrows(
                ctx,
                line,
                safe.zoom,
                safe.bounds
            );

        }
    );


    /* points */

    points.forEach(
        point => {

            drawCanvasPoint(
                ctx,
                point,
                safe.zoom,
                safe.bounds
            );

        }
    );


    /* header */

    drawExportHeader(
        ctx,
        mapType,
        safe.zoom
    );


    /* scale */

    drawScaleBar(
        ctx,
        safe.zoom,
        safe.bounds
    );


    /* notice */

    drawExportNotice(
        ctx
    );


    /* attribution */

    drawExportFooter(
        ctx,
        mapType
    );


    setProgress(
        92,
        "Canvas画像を仕上げています…"
    );


    return {
        canvas,
        zoom:safe.zoom,
        width:safe.width,
        height:safe.height
    };

}


/* =========================================================
   CANVAS TO BLOB
========================================================= */

function canvasToBlob(
    canvas,
    type,
    quality
){

    return new Promise(
        (resolve,reject) => {

            canvas.toBlob(
                blob => {

                    if(blob){

                        resolve(blob);

                    }else{

                        reject(
                            new Error(
                                "画像の生成に失敗しました。"
                            )
                        );

                    }

                },
                type,
                quality
            );

        }
    );

}

/* =========================================================
   RESIZE CANVAS FOR PDF
========================================================= */

function resizeCanvasForPdf(
    source,
    maxDimension = 3000
){

    const ratio =
        Math.min(
            1,
            maxDimension /
            Math.max(
                source.width,
                source.height
            )
        );


    if(ratio >= 1){

        return source;

    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        Math.max(
            1,
            Math.round(
                source.width *
                ratio
            )
        );

    canvas.height =
        Math.max(
            1,
            Math.round(
                source.height *
                ratio
            )
        );


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        source,
        0,
        0,
        canvas.width,
        canvas.height
    );


    return canvas;

}


/* =========================================================
   PDF EXPORT
========================================================= */

async function exportPDF(){

    showProgress();

    try{

        const requestedZoom =
            Number(
                exportDetail.value
            );


        let mapType =
            exportMapType.value;


        if(mapType === "current"){

            mapType =
                satelliteMode
                    ? "satellite"
                    : "normal";

        }


        const result =
            await buildExportCanvas(
                requestedZoom,
                mapType
            );


        setProgress(
            94,
            "PDFを生成しています…"
        );


        /*
         * PDFは1ページ。
         *
         * 元CanvasそのものをPDFへ入れると
         * iPadのメモリを大量に使用する可能性があるため、
         * PDF用だけ最大3000px程度に縮小。
         *
         * 内容そのものは同じCanvasから作成するので、
         * 線・矢印・地点・文字が欠落しません。
         */

        const pdfCanvas =
            resizeCanvasForPdf(
                result.canvas,
                3000
            );


        const imageData =
            pdfCanvas.toDataURL(
                "image/jpeg",
                .94
            );


        const {
            jsPDF
        } =
            window.jspdf;


        const orientation =
            pdfCanvas.width >=
            pdfCanvas.height
                ? "landscape"
                : "portrait";


        /*
         * PDFは1ページに収める。
         * 横長の場合はA3相当、
         * 縦長の場合も同じ比率で作成。
         */

        const baseWidth = 420;

        const ratio =
            pdfCanvas.height /
            pdfCanvas.width;

        const pdfWidth =
            baseWidth;

        const pdfHeight =
            Math.max(
                100,
                baseWidth *
                ratio
            );


        const pdf =
            new jsPDF({

                orientation,

                unit:"mm",

                format:[
                    pdfWidth,
                    pdfHeight
                ],

                compress:true

            });


        pdf.addImage(
            imageData,
            "JPEG",
            0,
            0,
            pdfWidth,
            pdfHeight,
            undefined,
            "FAST"
        );


        const filename =
            "route-reconstruction-" +
            new Date()
                .toISOString()
                .replace(
                    /[:.]/g,
                    "-"
                ) +
            ".pdf";


        pdf.save(
            filename
        );


        setProgress(
            100,
            "完了しました。"
        );


        setTimeout(
            hideProgress,
            700
        );


    }catch(error){

        console.error(error);

        hideProgress();

        alert(
            "PDFの書き出しに失敗しました。\n\n" +
            "画像サイズが大きすぎる場合は、詳細度を下げて再度試してください。"
        );

    }

}
