<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#f5f7fb"
>

<title>Route Reconstruction</title>


<!-- =========================================================
     LEAFLET
========================================================= -->

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>


<style>

/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

    -webkit-tap-highlight-color:
        transparent;

}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

    background:
        #f5f7fb;

    color:
        #172033;

}


/* =========================================================
   APP
========================================================= */

#app {

    position:
        relative;

    width:
        100%;

    height:
        100%;

}


/* =========================================================
   MAP
========================================================= */

#map {

    position:
        absolute;

    inset:
        0;

    z-index:
        1;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    position:
        absolute;

    top:
        14px;

    left:
        14px;

    right:
        14px;

    z-index:
        1000;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        flex-start;

    pointer-events:
        none;

}


.title-card {

    pointer-events:
        auto;

    padding:
        11px 15px;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-radius:
        16px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.12);

}


.title {

    font-size:
        15px;

    font-weight:
        750;

}


.subtitle {

    margin-top:
        2px;

    font-size:
        11px;

    color:
        #697386;

}


.map-buttons {

    display:
        flex;

    gap:
        7px;

    pointer-events:
        auto;

}


.map-button {

    width:
        44px;

    height:
        44px;

    border:
        none;

    border-radius:
        14px;

    background:
        rgba(255,255,255,.95);

    box-shadow:
        0 8px 25px rgba(0,0,0,.13);

    font-size:
        19px;

    cursor:
        pointer;

    transition:
        transform .15s ease;

}


.map-button:active {

    transform:
        scale(.92);

}


/* =========================================================
   HELP
========================================================= */

.help {

    position:
        absolute;

    top:
        76px;

    left:
        50%;

    transform:
        translateX(-50%);

    z-index:
        1500;

    padding:
        9px 14px;

    border-radius:
        999px;

    background:
        rgba(23,32,51,.92);

    color:
        white;

    font-size:
        12px;

    white-space:
        nowrap;

    opacity:
        0;

    pointer-events:
        none;

    transition:
        opacity .2s ease;

}


.help.show {

    opacity:
        1;

}


/* =========================================================
   MODE BAR
========================================================= */

.modebar {

    position:
        absolute;

    left:
        50%;

    bottom:
        18px;

    transform:
        translateX(-50%);

    z-index:
        1000;

    display:
        flex;

    gap:
        5px;

    padding:
        7px;

    background:
        rgba(255,255,255,.95);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    border-radius:
        20px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.16);

}


.mode-button {

    min-width:
        67px;

    height:
        50px;

    border:
        none;

    border-radius:
        15px;

    background:
        transparent;

    color:
        #566174;

    font-size:
        11px;

    font-weight:
        650;

    cursor:
        pointer;

}


.mode-button .icon {

    display:
        block;

    margin-bottom:
        2px;

    font-size:
        20px;

    line-height:
        22px;

}


.mode-button.active {

    background:
        #172033;

    color:
        white;

}


/* =========================================================
   INFO
========================================================= */

.info-card {

    position:
        absolute;

    right:
        14px;

    bottom:
        95px;

    z-index:
        800;

    max-width:
        250px;

    padding:
        10px 12px;

    background:
        rgba(255,255,255,.90);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    border-radius:
        13px;

    box-shadow:
        0 6px 22px rgba(0,0,0,.11);

    font-size:
        10px;

    line-height:
        1.5;

    color:
        #6b7280;

}


/* =========================================================
   OVERLAY
========================================================= */

.overlay {

    position:
        fixed;

    inset:
        0;

    z-index:
        3000;

    display:
        none;

    align-items:
        flex-end;

    background:
        rgba(0,0,0,.28);

    backdrop-filter:
        blur(3px);

    -webkit-backdrop-filter:
        blur(3px);

}


.overlay.show {

    display:
        flex;

}


/* =========================================================
   SHEET
========================================================= */

.sheet {

    width:
        min(540px, 100%);

    max-height:
        90vh;

    overflow-y:
        auto;

    background:
        white;

    border-radius:
        24px 24px 0 0;

    padding:
        18px
        18px
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    box-shadow:
        0 -10px 40px rgba(0,0,0,.18);

    animation:
        sheetUp .22s ease;

}


@keyframes sheetUp {

    from {

        transform:
            translateY(100%);

    }

    to {

        transform:
            translateY(0);

    }

}


.sheet-handle {

    width:
        38px;

    height:
        4px;

    margin:
        0 auto 15px;

    background:
        #d7dbe3;

    border-radius:
        999px;

}


.sheet-title {

    margin-bottom:
        17px;

    font-size:
        20px;

    font-weight:
        750;

}


/* =========================================================
   FORM
========================================================= */

.field {

    margin-bottom:
        14px;

}


.field label {

    display:
        block;

    margin-bottom:
        6px;

    font-size:
        12px;

    font-weight:
        700;

    color:
        #697386;

}


.field input,
.field textarea,
.field select {

    width:
        100%;

    border:
        1px solid #dce1e9;

    border-radius:
        13px;

    padding:
        12px 13px;

    outline:
        none;

    background:
        #f8f9fb;

    font-size:
        16px;

    font-family:
        inherit;

}


.field textarea {

    min-height:
        240px;

    resize:
        vertical;

    font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size:
        12px;

    line-height:
        1.55;

}


.field input:focus,
.field textarea:focus,
.field select:focus {

    border-color:
        #7b879c;

    background:
        white;

}


/* =========================================================
   BUTTONS
========================================================= */

.actions {

    display:
        flex;

    gap:
        9px;

    margin-top:
        17px;

}


.action-button {

    flex:
        1;

    min-height:
        48px;

    border:
        none;

    border-radius:
        14px;

    font-size:
        13px;

    font-weight:
        700;

    cursor:
        pointer;

}


.cancel-button {

    background:
        #eef1f5;

    color:
        #303949;

}


.save-button {

    background:
        #172033;

    color:
        white;

}


.delete-button {

    background:
        #ffe8e8;

    color:
        #d92d20;

}


.secondary-button {

    background:
        #e9f1ff;

    color:
        #1769d2;

}


/* =========================================================
   JSON
========================================================= */

.json-count {

    margin:
        -7px 0 13px;

    font-size:
        11px;

    color:
        #7a8494;

}


.copy-status {

    min-height:
        17px;

    margin-top:
        7px;

    font-size:
        11px;

    text-align:
        center;

    color:
        #22a06b;

}


/* =========================================================
   COLOR
========================================================= */

.color-row {

    display:
        flex;

    gap:
        8px;

    flex-wrap:
        wrap;

}


.color-option {

    width:
        34px;

    height:
        34px;

    padding:
        0;

    border:
        3px solid white;

    border-radius:
        50%;

    box-shadow:
        0 0 0 1px #d4d9e1;

    cursor:
        pointer;

}


.color-option.selected {

    box-shadow:
        0 0 0 3px #172033;

}


/* =========================================================
   POINT
========================================================= */

.custom-point {

    width:
        28px;

    height:
        28px;

    border:
        4px solid #1d74f5;

    border-radius:
        50%;

    background:
        white;

    box-shadow:
        0 2px 8px rgba(0,0,0,.25);

}


/* =========================================================
   ARROW
========================================================= */

.route-arrow-icon {

    background:
        transparent !important;

    border:
        none !important;

}


/* =========================================================
   LINE DRAW BAR
========================================================= */

.line-editor {

    position:
        absolute;

    left:
        50%;

    bottom:
        90px;

    transform:
        translateX(-50%);

    z-index:
        1600;

    display:
        none;

    gap:
        6px;

    padding:
        8px;

    background:
        rgba(255,255,255,.96);

    border-radius:
        17px;

    box-shadow:
        0 8px 30px rgba(0,0,0,.17);

}


.line-editor.show {

    display:
        flex;

}


.line-editor button {

    border:
        none;

    padding:
        10px 13px;

    border-radius:
        11px;

    background:
        #eef1f5;

    font-size:
        12px;

    font-weight:
        700;

    cursor:
        pointer;

}


/* =========================================================
   EXPORT OPTIONS
========================================================= */

.export-description {

    padding:
        12px;

    border-radius:
        13px;

    background:
        #f5f7fb;

    color:
        #697386;

    font-size:
        12px;

    line-height:
        1.6;

    margin-bottom:
        15px;

}


.export-option {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    padding:
        12px 13px;

    border:
        1px solid #dce1e9;

    border-radius:
        13px;

    margin-bottom:
        9px;

    cursor:
        pointer;

}


.export-option input {

    width:
        18px;

    height:
        18px;

}


.export-option strong {

    display:
        block;

    font-size:
        13px;

}


.export-option span {

    display:
        block;

    margin-top:
        2px;

    font-size:
        11px;

    color:
        #7a8494;

}


/* =========================================================
   EXPORT PROGRESS
========================================================= */

.export-progress {

    display:
        none;

    margin-top:
        15px;

}


.export-progress.show {

    display:
        block;

}


.progress-text {

    text-align:
        center;

    font-size:
        12px;

    color:
        #697386;

    margin-bottom:
        8px;

}


.progress-track {

    width:
        100%;

    height:
        8px;

    background:
        #edf0f4;

    border-radius:
        999px;

    overflow:
        hidden;

}


.progress-bar {

    width:
        0%;

    height:
        100%;

    background:
        #172033;

    border-radius:
        999px;

    transition:
        width .2s ease;

}


/* =========================================================
   EXPORT MAP
========================================================= */

/*
    PDF書き出し専用。

    画面外に置くが display:none にはしない。
    html2canvasが正しく地図を描画できるようにする。
*/

#printArea {

    position:
        fixed;

    left:
        -100000px;

    top:
        0;

    width:
        1000px;

    height:
        700px;

    z-index:
        -9999;

    background:
        white;

    overflow:
        hidden;

}


#exportMap {

    width:
        100%;

    height:
        100%;

}


/* =========================================================
   PRINT HEADER
========================================================= */

.export-header {

    position:
        absolute;

    left:
        12px;

    top:
        12px;

    z-index:
        2000;

    padding:
        7px 10px;

    background:
        rgba(255,255,255,.94);

    border-radius:
        9px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.15);

    font-size:
        12px;

    font-weight:
        700;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 520px) {

    .topbar {

        top:
            10px;

        left:
            10px;

        right:
            10px;

    }


    .title-card {

        padding:
            9px 12px;

    }


    .title {

        font-size:
            14px;

    }


    .subtitle {

        font-size:
            10px;

    }


    .map-button {

        width:
            41px;

        height:
            41px;

    }


    .modebar {

        left:
            10px;

        right:
            10px;

        bottom:
            10px;

        width:
            auto;

        transform:
            none;

    }


    .mode-button {

        flex:
            1;

        min-width:
            0;

    }


    .info-card {

        display:
            none;

    }

}

</style>

</head>


<body>


<div id="app">


    <div id="map"></div>


    <!-- =====================================================
         TOP
    ====================================================== -->

    <div class="topbar">

        <div class="title-card">

            <div class="title">
                Route Reconstruction
            </div>

            <div class="subtitle">
                手動ルート再構成
            </div>

        </div>


        <div class="map-buttons">

            <button
                class="map-button"
                id="satelliteButton"
                title="航空写真"
            >
                🛰️
            </button>


            <button
                class="map-button"
                id="saveButton"
                title="保存"
            >
                💾
            </button>


            <button
                class="map-button"
                id="menuButton"
                title="データ"
            >
                ⋯
            </button>

        </div>

    </div>


    <!-- =====================================================
         HELP
    ====================================================== -->

    <div
        id="help"
        class="help"
    ></div>


    <!-- =====================================================
         LINE EDITOR
    ====================================================== -->

    <div
        id="lineEditor"
        class="line-editor"
    >

        <button
            id="lineUndoButton"
        >
            ↩ 戻す
        </button>


        <button
            id="lineFinishButton"
        >
            ✓ 完了
        </button>


        <button
            id="lineCancelButton"
        >
            × キャンセル
        </button>

    </div>


    <!-- =====================================================
         INFO
    ====================================================== -->

    <div class="info-card">

        この地図は手動で配置・再構成したデータです。<br>

        過去のGPSログを示すものではありません。

    </div>


    <!-- =====================================================
         MODE
    ====================================================== -->

    <div class="modebar">

        <button
            class="mode-button active"
            data-mode="select"
        >

            <span class="icon">
                👆
            </span>

            選択

        </button>


        <button
            class="mode-button"
            data-mode="point"
        >

            <span class="icon">
                📍
            </span>

            地点

        </button>


        <button
            class="mode-button"
            data-mode="line"
        >

            <span class="icon">
                ✏️
            </span>

            線

        </button>


        <button
            class="mode-button"
            data-mode="delete"
        >

            <span class="icon">
                🗑️
            </span>

            削除

        </button>

    </div>

</div>


<!-- =========================================================
     POINT MODAL
========================================================= -->

<div
    id="pointOverlay"
    class="overlay"
>

    <div class="sheet">

        <div class="sheet-handle"></div>

        <div class="sheet-title">
            地点を編集
        </div>


        <div class="field">

            <label>
                時間
            </label>

            <input
                id="pointTime"
                type="time"
            >

        </div>


        <div class="field">

            <label>
                場所
            </label>

            <input
                id="pointPlace"
                type="text"
                placeholder="例：学校正門"
            >

        </div>


        <div class="actions">

            <button
                id="pointCancel"
                class="action-button cancel-button"
            >
                キャンセル
            </button>


            <button
                id="pointDelete"
                class="action-button delete-button"
            >
                🗑️ 削除
            </button>


            <button
                id="pointSave"
                class="action-button save-button"
            >
                保存
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     LINE MODAL
========================================================= -->

<div
    id="lineOverlay"
    class="overlay"
>

    <div class="sheet">

        <div class="sheet-handle"></div>

        <div class="sheet-title">
            線を編集
        </div>


        <div class="field">

            <label>
                線の色
            </label>


            <div class="color-row">


                <button
                    class="color-option selected"
                    data-color="#1d74f5"
                    style="background:#1d74f5"
                ></button>


                <button
                    class="color-option"
                    data-color="#22a06b"
                    style="background:#22a06b"
                ></button>


                <button
                    class="color-option"
                    data-color="#f59e0b"
                    style="background:#f59e0b"
                ></button>


                <button
                    class="color-option"
                    data-color="#ef4444"
                    style="background:#ef4444"
                ></button>


                <button
                    class="color-option"
                    data-color="#8b5cf6"
                    style="background:#8b5cf6"
                ></button>


                <button
                    class="color-option"
                    data-color="#6b7280"
                    style="background:#6b7280"
                ></button>

            </div>

        </div>


        <div class="field">

            <label>
                線の太さ
            </label>


            <select id="lineWidth">

                <option value="3">
                    細い
                </option>

                <option
                    value="5"
                    selected
                >
                    標準
                </option>

                <option value="8">
                    太い
                </option>

            </select>

        </div>


        <div class="actions">

            <button
                id="lineCancel"
                class="action-button cancel-button"
            >
                閉じる
            </button>


            <button
                id="lineDelete"
                class="action-button delete-button"
            >
                🗑️ 削除
            </button>


            <button
                id="lineSave"
                class="action-button save-button"
            >
                保存
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     DATA MENU
========================================================= -->

<div
    id="menuOverlay"
    class="overlay"
>

    <div class="sheet">

        <div class="sheet-handle"></div>

        <div class="sheet-title">
            データ
        </div>


        <div class="actions">

            <button
                id="jsonViewButton"
                class="action-button secondary-button"
            >
                📋 JSONを見る
            </button>


            <button
                id="exportButton"
                class="action-button save-button"
            >
                📤 JSON保存
            </button>

        </div>


        <div class="actions">

            <button
                id="importButton"
                class="action-button cancel-button"
            >
                📥 JSON読み込み
            </button>


            <button
                id="menuClose"
                class="action-button cancel-button"
            >
                閉じる
            </button>

        </div>


        <div class="actions">

            <button
                id="pdfButton"
                class="action-button secondary-button"
            >
                📄 100m詳細PDF
            </button>

        </div>


        <div class="actions">

            <button
                id="clearButton"
                class="action-button delete-button"
            >
                🗑️ すべて削除
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     PDF EXPORT MENU
========================================================= -->

<div
    id="pdfOverlay"
    class="overlay"
>

    <div class="sheet">

        <div class="sheet-handle"></div>

        <div class="sheet-title">
            100m詳細PDF
        </div>


        <div class="export-description">

            広い範囲を1枚に縮小するのではなく、
            同じ細かさの地図を複数ページに分けて書き出します。<br><br>

            線の太さ・色・矢印・地点・時刻も
            各ページに反映されます。

        </div>


        <div class="field">

            <label>
                地図
            </label>


            <label class="export-option">

                <input
                    type="radio"
                    name="pdfMapType"
                    value="normal"
                    checked
                >

                <div>

                    <strong>
                        🗺️ 通常の地図
                    </strong>

                    <span>
                        OpenStreetMap
                    </span>

                </div>

            </label>


            <label class="export-option">

                <input
                    type="radio"
                    name="pdfMapType"
                    value="satellite"
                >

                <div>

                    <strong>
                        🛰️ 航空写真
                    </strong>

                    <span>
                        衛星・航空写真を背景にします
                    </span>

                </div>

            </label>

        </div>


        <div class="field">

            <label class="export-option">

                <input
                    id="pdfLabels"
                    type="checkbox"
                    checked
                >

                <div>

                    <strong>
                        📍 地点名・時刻を表示
                    </strong>

                    <span>
                        PDF上にも地点情報を表示します
                    </span>

                </div>

            </label>

        </div>


        <div
            id="exportProgress"
            class="export-progress"
        >

            <div
                id="progressText"
                class="progress-text"
            >
                準備中…
            </div>


            <div class="progress-track">

                <div
                    id="progressBar"

<script>

"use strict";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "route-reconstruction-data-v3";


/* =========================================================
   MAIN MAP
========================================================= */

const map =
    L.map(
        "map",
        {

            zoomControl:
                false,

            doubleClickZoom:
                false,

            attributionControl:
                true

        }
    )
    .setView(
        [32.85,129.85],
        13
    );


L.control.zoom(
    {
        position:
            "bottomright"
    }
).addTo(map);


/* =========================================================
   NORMAL MAP
========================================================= */

const normalLayer =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {

            maxZoom:
                19,

            crossOrigin:
                true,

            attribution:
                "&copy; OpenStreetMap contributors"

        }
    );


/* =========================================================
   SATELLITE MAP
========================================================= */

const satelliteLayer =
    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {

            maxZoom:
                19,

            crossOrigin:
                true,

            attribution:
                "Tiles &copy; Esri"

        }
    );


normalLayer.addTo(
    map
);


let satelliteMode =
    false;


/* =========================================================
   SCALE
========================================================= */

L.control.scale(
    {

        imperial:
            false,

        metric:
            true,

        maxWidth:
            150

    }
).addTo(map);


/* =========================================================
   DATA
========================================================= */

let points = [];

let lines = [];


/* =========================================================
   STATE
========================================================= */

let currentMode =
    "select";


let currentPointId =
    null;


let currentLineId =
    null;


let lineDrawing =
    false;


let temporaryLineCoords =
    [];


let temporaryLine =
    null;


const pointLayers =
    new Map();


const lineLayers =
    new Map();


/* =========================================================
   EXPORT MAP STATE
========================================================= */

let exportMap =
    null;


let exportNormalLayer =
    null;


let exportSatelliteLayer =
    null;


/* =========================================================
   HELP
========================================================= */

const help =
    document.getElementById(
        "help"
    );


let helpTimer =
    null;


function showHelp(
    message
) {

    help.textContent =
        message;


    help.classList.add(
        "show"
    );


    clearTimeout(
        helpTimer
    );


    helpTimer =
        setTimeout(
            () => {

                help.classList.remove(
                    "show"
                );

            },
            2300
        );

}


/* =========================================================
   ID
========================================================= */

function createId(
    prefix
) {

    return (

        prefix +

        "_" +

        Date.now()
            .toString(36) +

        "_" +

        Math.random()
            .toString(36)
            .slice(2,8)

    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   NORMALIZE DATA
========================================================= */

function normalizeData(
    data
) {

    if (
        !data ||
        typeof data !==
            "object"
    ) {

        throw new Error(
            "JSONデータが正しくありません。"
        );

    }


    const normalizedPoints =
        Array.isArray(
            data.points
        )
            ? data.points
            : [];


    const normalizedLines =
        Array.isArray(
            data.lines
        )
            ? data.lines
            : [];


    return {

        version:
            5,


        note:
            "手動で配置・再構成したルートデータです。過去GPSログではありません。",


        points:

            normalizedPoints

                .map(
                    (
                        p,
                        index
                    ) => {

                        return {

                            id:
                                p.id ||

                                (
                                    "point_" +

                                    String(
                                        index + 1
                                    )
                                    .padStart(
                                        3,
                                        "0"
                                    )
                                ),

                            lat:
                                Number(
                                    p.lat
                                ),

                            lng:
                                Number(
                                    p.lng
                                ),

                            time:
                                typeof p.time ===
                                "string"
                                    ? p.time
                                    : "",

                            place:
                                typeof p.place ===
                                "string"
                                    ? p.place
                                    : ""

                        };

                    }
                )

                .filter(
                    p =>

                        Number.isFinite(
                            p.lat
                        ) &&

                        Number.isFinite(
                            p.lng
                        )
                ),


        lines:

            normalizedLines

                .map(
                    (
                        line,
                        index
                    ) => {

                        const coords =
                            Array.isArray(
                                line.coords
                            )
                                ? line.coords
                                : [];


                        return {

                            id:
                                line.id ||

                                (
                                    "line_" +

                                    String(
                                        index + 1
                                    )
                                    .padStart(
                                        3,
                                        "0"
                                    )
                                ),


                            color:
                                line.color ||
                                "#1d74f5",


                            width:
                                Number(
                                    line.width
                                ) || 5,


                            dash:
                                line.dash ||
                                "",


                            coords:

                                coords

                                    .map(
                                        coord => {

                                            if (
                                                !Array.isArray(
                                                    coord
                                                ) ||
                                                coord.length <
                                                    2
                                            ) {

                                                return null;

                                            }


                                            const lat =
                                                Number(
                                                    coord[0]
                                                );


                                            const lng =
                                                Number(
                                                    coord[1]
                                                );


                                            if (
                                                !Number.isFinite(
                                                    lat
                                                ) ||

                                                !Number.isFinite(
                                                    lng
                                                )
                                            ) {

                                                return null;

                                            }


                                            return [
                                                lat,
                                                lng
                                            ];

                                        }
                                    )

                                    .filter(
                                        Boolean
                                    )

                        };

                    }
                )

                .filter(
                    line =>
                        line.coords.length >=
                        2
                )

    };

}


/* =========================================================
   SAVE
========================================================= */

function saveData() {

    const data = {

        version:
            5,

        type:
            "route-reconstruction",

        note:
            "手動で配置・再構成したルートデータです。過去GPSログではありません。",

        points,

        lines

    };


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            data
        )
    );

}


/* =========================================================
   LOAD
========================================================= */

function loadData() {

    try {

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if (!raw) {

            points =
                [];

            lines =
                [];

            return;

        }


        const data =
            JSON.parse(
                raw
            );


        const normalized =
            normalizeData(
                data
            );


        points =
            normalized.points;


        lines =
            normalized.lines;


    } catch (
        error
    ) {

        console.error(
            error
        );


        alert(
            "保存されていたデータの読み込みに失敗しました。"
        );

    }

}


/* =========================================================
   CURRENT DATA
========================================================= */

function getCurrentData() {

    return {

        version:
            5,

        type:
            "route-reconstruction",

        createdAt:
            new Date().toISOString(),

        note:
            "手動で配置・再構成したルートデータです。過去GPSログではありません。",

        points,

        lines

    };

}


/* =========================================================
   JSON
========================================================= */

function getCurrentJson() {

    return JSON.stringify(
        getCurrentData(),
        null,
        2
    );

}


/* =========================================================
   ARROW ANGLE
========================================================= */

function getArrowAngle(
    a,
    b
) {

    const pa =
        map.latLngToLayerPoint(
            a
        );


    const pb =
        map.latLngToLayerPoint(
            b
        );


    const dx =
        pb.x -
        pa.x;


    const dy =
        pb.y -
        pa.y;


    return (

        Math.atan2(
            dy,
            dx
        ) *

        180 /

        Math.PI

    );

}


/* =========================================================
   CREATE ARROW
========================================================= */

function createArrowMarker(
    latlng,
    angle,
    color,
    size
) {

    const arrowIcon =
        L.divIcon(
            {

                className:
                    "route-arrow-icon",


                html:

                    `
                    <div
                        style="
                            width:${size}px;
                            height:${size}px;

                            display:flex;

                            align-items:center;

                            justify-content:center;

                            transform:
                                rotate(${angle}deg);

                            transform-origin:
                                center;

                            color:${color};

                            font-size:${size}px;

                            font-weight:900;

                            line-height:1;

                            text-shadow:
                                0 1px 2px rgba(0,0,0,.35);
                        "
                    >▶</div>
                    `,


                iconSize:
                    [
                        size,
                        size
                    ],


                iconAnchor:
                    [
                        size / 2,
                        size / 2
                    ],


                interactive:
                    false

            }
        );


    return L.marker(
        latlng,
        {

            icon:
                arrowIcon,

            interactive:
                false,

            keyboard:
                false,

            zIndexOffset:
                500

        }
    );

}


/* =========================================================
   CREATE LINE ARROWS
========================================================= */

function createLineArrows(
    line
) {

    const coords =
        line.coords;


    if (
        !Array.isArray(
            coords
        ) ||

        coords.length <
            2
    ) {

        return [];

    }


    const arrows =
        [];


    const segmentLengths =
        [];


    let totalLength =
        0;


    for (
        let i = 0;
        i < coords.length - 1;
        i++
    ) {

        const a =
            L.latLng(
                coords[i][0],
                coords[i][1]
            );


        const b =
            L.latLng(
                coords[i + 1][0],
                coords[i + 1][1]
            );


        const distance =
            a.distanceTo(
                b
            );


        segmentLengths.push(
            distance
        );


        totalLength +=
            distance;

    }


    if (
        totalLength <=
        0
    ) {

        return arrows;

    }


    /*
        線の長さによって矢印数を変更。

        短い線
        → 1個

        中くらい
        → 2〜3個

        長い線
        → 最大8個
    */

    const arrowCount =
        Math.max(
            1,
            Math.min(
                8,
                Math.floor(
                    totalLength /
                    180
                ) + 1
            )
        );


    for (
        let n = 1;
        n <= arrowCount;
        n++
    ) {

        const targetDistance =

            totalLength *

            (
                0.15 +

                (
                    0.70 *

                    (
                        n /
                        (
                            arrowCount +
                            1
                        )
                    )
                )
            );


        let accumulated =
            0;


        let segmentIndex =
            0;


        for (
            let i = 0;
            i < segmentLengths.length;
            i++
        ) {

            if (
                accumulated +
                segmentLengths[i]
                >=
                targetDistance
            ) {

                segmentIndex =
                    i;

                break;

            }


            accumulated +=
                segmentLengths[i];

        }


        const a =
            L.latLng(
                coords[
                    segmentIndex
                ][0],
                coords[
                    segmentIndex
                ][1]
            );


        const b =
            L.latLng(
                coords[
                    segmentIndex + 1
                ][0],
                coords[
                    segmentIndex + 1
                ][1]
            );


        const remaining =
            targetDistance -
            accumulated;


        const segmentLength =
            segmentLengths[
                segmentIndex
            ];


        const ratio =
            segmentLength > 0
                ? remaining /
                    segmentLength
                : 0;


        const lat =
            a.lat +
            (
                b.lat -
                a.lat
            ) *
            ratio;


        const lng =
            a.lng +
            (
                b.lng -
                a.lng
            ) *
            ratio;


        const angle =
            getArrowAngle(
                a,
                b
            );


        const size =
            Math.max(
                18,
                Math.min(
                    27,
                    (
                        Number(
                            line.width
                        ) || 5
                    ) * 4
                )
            );


        const arrow =
            createArrowMarker(
                [lat,lng],
                angle,
                line.color ||
                    "#1d74f5",
                size
            );


        arrow.addTo(
            map
        );


        arrows.push(
            arrow
        );

    }


    return arrows;

}


/* =========================================================
   RENDER
========================================================= */

function render() {


    /* =====================================================
       REMOVE OLD POINTS
    ====================================================== */

    pointLayers.forEach(
        layer => {

            if (
                map.hasLayer(
                    layer
                )
            ) {

                map.removeLayer(
                    layer
                );

            }

        }
    );


    pointLayers.clear();


    /* =====================================================
       REMOVE OLD LINES + ARROWS
    ====================================================== */

    lineLayers.forEach(
        item => {

            if (
                item.polyline &&
                map.hasLayer(
                    item.polyline
                )
            ) {

                map.removeLayer(
                    item.polyline
                );

            }


            if (
                Array.isArray(
                    item.arrows
                )
            ) {

                item.arrows.forEach(
                    arrow => {

                        if (
                            map.hasLayer(
                                arrow
                            )
                        ) {

                            map.removeLayer(
                                arrow
                            );

                        }

                    }
                );

            }

        }
    );


    lineLayers.clear();


    /* =====================================================
       POINTS
    ====================================================== */

    points.forEach(
        point => {


            const icon =
                L.divIcon(
                    {

                        className:
                            "",

                        html:
                            `
                            <div
                                class="custom-point"
                            ></div>
                            `,

                        iconSize:
                            [
                                28,
                                28
                            ],

                        iconAnchor:
                            [
                                14,
                                14
                            ],

                        popupAnchor:
                            [
                                0,
                                -14
                            ]

                    }
                );


            const marker =
                L.marker(
                    [
                        point.lat,
                        point.lng
                    ],
                    {

                        icon,

                        draggable:
                            true

                    }
                );


            marker.addTo(
                map
            );


            /* =================================================
               DRAG
            ================================================== */

            marker.on(
                "dragend",
                event => {

                    const position =
                        event.target
                            .getLatLng();


                    const target =
                        points.find(
                            p =>
                                p.id ===
                                point.id
                        );


                    if (!target) {

                        return;

                    }


                    target.lat =
                        position.lat;


                    target.lng =
                        position.lng;


                    saveData();


                    showHelp(
                        "地点を移動しました"
                    );

                }
            );


            /* =================================================
               CLICK
            ================================================== */

            marker.on(
                "click",
                event => {

                    L.DomEvent.stopPropagation(
                        event
                    );


                    if (
                        currentMode ===
                        "delete"
                    ) {

                        deletePointById(
                            point.id
                        );


                        return;

                    }


                    if (
                        currentMode ===
                        "select"
                    ) {

                        openPointModal(
                            point.id
                        );

                    }

                }
            );


            marker.bindPopup(
                `
                <div
                    style="
                        font-weight:750;
                        font-size:14px;
                    "
                >
                    ${
                        escapeHtml(
                            point.place ||
                            "名称なし"
                        )
                    }
                </div>

                <div
                    style="
                        color:#6b7280;
                        font-size:12px;
                        margin-top:3px;
                    "
                >
                    ${
                        point.time ||
                        "時間未設定"
                    }
                </div>
                `
            );


            pointLayers.set(
                point.id,
                marker
            );

        }
    );


    /* =====================================================
       LINES
    ====================================================== */

    lines.forEach(
        line => {


            const polyline =
                L.polyline(
                    line.coords,
                    {

                        color:
                            line.color ||
                            "#1d74f5",

                        weight:
                            line.width ||
                            5,

                        opacity:
                            .9,

                        dashArray:
                            line.dash ||
                            null,

                        lineCap:
                            "round",

                        lineJoin:
                            "round",

                        bubblingMouseEvents:
                            false

                    }
                );


            polyline.addTo(
                map
            );


            /* =================================================
               ARROWS
            ================================================== */

            const arrows =
                createLineArrows(
                    line
                );


            /* =================================================
               LINE CLICK
            ================================================== */

            polyline.on(
                "click",
                event => {

                    L.DomEvent.stopPropagation(
                        event
                    );


                    if (
                        currentMode ===
                        "delete"
                    ) {

                        deleteLineById(
                            line.id
                        );


                        return;

                    }


                    if (
                        currentMode ===
                        "select"
                    ) {

                        openLineModal(
                            line.id
                        );

                    }

                }
            );


            lineLayers.set(
                line.id,
                {

                    polyline,

                    arrows

                }
            );

        }
    );

}


/* =========================================================
   MODE
========================================================= */

function setMode(
    mode
) {


    if (
        currentMode ===
        "line" &&

        lineDrawing
    ) {

        cancelLine();

    }


    currentMode =
        mode;


    document
        .querySelectorAll(
            ".mode-button"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.mode ===
                        mode
                );

            }
        );


    if (
        mode ===
        "select"
    ) {

        showHelp(
            "地点や線をタップして編集"
        );

    }


    if (
        mode ===
        "point"
    ) {

        showHelp(
            "地図をタップして地点を追加"
        );

    }


    if (
        mode ===
        "line"
    ) {

        showHelp(
            "地図をタップして線を描く"
        );

    }


    if (
        mode ===
        "delete"
    ) {

        showHelp(
            "削除したい地点・線をタップ"
        );

    }

}


/* =========================================================
   MODE BUTTONS
========================================================= */

document
    .querySelectorAll(
        ".mode-button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    setMode(
                        button.dataset.mode
                    );

                }
            );

        }
    );


/* =========================================================
   MAP CLICK
========================================================= */

map.on(
    "click",
    event => {


        if (
            currentMode ===
            "point"
        ) {

            createPoint(
                event.latlng.lat,
                event.latlng.lng
            );


            return;

        }


        if (
            currentMode ===
            "line"
        ) {

            addLinePoint(
                event.latlng.lat,
                event.latlng.lng
            );


            return;

        }

    }
);


/* =========================================================
   CREATE POINT
========================================================= */

function createPoint(
    lat,
    lng
) {

    const point = {

        id:
            createId(
                "point"
            ),

        lat,

        lng,

        time:
            "",

        place:
            ""

    };


    points.push(
        point
    );


    saveData();

    render();

    openPointModal(
        point.id
    );

}


/* =========================================================
   POINT MODAL
========================================================= */

function openPointModal(
    id
) {

    const point =
        points.find(
            p =>
                p.id ===
                id
        );


    if (!point) {

function addLinePoint(

    lng
) {


    if (
        !lineDrawing

        lineDrawing =
            true;


        temporaryLineCoords =
            [];


        document
            .getElementById(
                "lineEditor"
            )
            .classList.add(

            );

    temporaryLineCoords.push(
        [
            lat,
            lng
        ]
    );


    updateTemporaryLine();

/* =========================================================
   TEMPORARY LINE
========================================================= */

function updateTemporaryLine() {


    if (
        temporaryLine
    ) {

        map.removeLayer(
            temporaryLine
        );


        temporaryLine =
            null;

    }


    if (
        temporaryLineCoords.length <
        2
    ) {

        return;

    }


    temporaryLine =
        L.polyline(
            temporaryLineCoords,
            {

                color:
                    "#172033",

                weight:
                    5,

                dashArray:
                    "8 7",

                opacity:
                    .75,

                lineCap:
                    "round",

                lineJoin:
                    "round",

                interactive:
                    false

            }
        )
        .addTo(
            map
        );

}

    if (
        !lineDrawing

        hideLineEditor();

        return;

    }


    if (
        temporaryLineCoords.length >=
        2
    ) {


        const line = {

            id:
                createId(
                    "line"
                ),

            coords:
                temporaryLineCoords.map(
                    coord => [

                        coord[0],

                        coord[1]

                    ]
                ),

            color:
                "#1d74f5",

            width:
                5,

            dash:
                ""

        lines.push(
            line

    if (

            temporaryLine
        );


        temporaryLine =
            null;

    }


    temporaryLineCoords =
        [];


    lineDrawing =

    render();


    setMode(

/* =========================================================
   COPY
========================================================= */

async function copyText(
    text
) {


    try {

        await navigator.clipboard.writeText(
            text
        );

        return true;

    } catch (
        error
    ) {


        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        textarea.style.position =
            "fixed";


        textarea.style.opacity =
            "0";


        document.body.appendChild(
            textarea
        );


        textarea.focus();

        textarea.select();


        let success =
            false;


        try {

            success =
                document.execCommand(
                    "copy"
                );

        } catch (
            e
        ) {

            success =
                false;

        }


        textarea.remove();


        return success;

    }

}

/* =========================================================
   GET ROUTE BOUNDS
========================================================= */

function getRouteBounds() {

    let bounds =
        null;


    function add(
        lat,
        lng
    ) {

        if (
            !Number.isFinite(
                lat
            ) ||
            !Number.isFinite(
                lng
            )
        ) {

            return;

        }


        const latlng =
            L.latLng(
                lat,
                lng
            );


        if (!bounds) {

            bounds =
                L.latLngBounds(
                    latlng,
                    latlng
                );

        } else {

            bounds.extend(
                latlng
            );

        }

    }


    points.forEach(
        point => {

            add(
                Number(
                    point.lat
                ),
                Number(
                    point.lng
                )
            );

        }
    );


    lines.forEach(
        line => {

            if (
                !Array.isArray(
                    line.coords
                )
            ) {

                return;

            }


            line.coords.forEach(
                coord => {

                    if (
                        !Array.isArray(
                            coord
                        ) ||
                        coord.length <
                            2
                    ) {

                        return;

                    }


                    add(
                        Number(
                            coord[0]
                        ),
                        Number(
                            coord[1]
                        )
                    );

                }
            );

        }
    );


    return bounds;

}
