        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {

                maxZoom:
                    19,

                crossOrigin:
                    true

            }
        );


    return exportMap;

}


/* =========================================================
   WAIT FOR TILES
========================================================= */

function waitForTiles(
    mapObject,
    timeout
) {

    return new Promise(
        resolve => {


            let finished =
                false;


            let loaded =
                0;


            const finish =
                () => {

                    if (
                        finished
                    ) {

                        return;

                    }


                    finished =
                        true;


                    clearTimeout(
                        timer
                    );


                    setTimeout(
                        resolve,
                        400
                    );

                };


            const timer =
                setTimeout(
                    finish,
                    timeout
                );


            mapObject.eachLayer(
                layer => {

                    if (
                        layer instanceof
                        L.TileLayer
                    ) {


                        const tileCount =
                            layer.getContainer()
                                ? layer.getContainer()
                                    .querySelectorAll(
                                        "img"
                                    ).length
                                : 0;


                        if (
                            tileCount ===
                            0
                        ) {

                            finish();

                        }

                    }

                }
            );


            mapObject.once(
                "load",
                () => {

                    finish();

                }
            );


            setTimeout(
                () => {

                    finish();

                },
                1800
            );

        }
    );

}


/* =========================================================
   DRAW VECTOR OVERLAY
========================================================= */

function drawExportVectorOverlay(
    canvas,
    exportMapObject,
    showLabels
) {


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
        線
    */

    lines.forEach(
        line => {


            if (
                !Array.isArray(
                    line.coords
                ) ||
                line.coords.length <
                    2
            ) {

                return;

            }


            ctx.save();


            ctx.beginPath();


            const first =
                exportMapObject
                    .latLngToContainerPoint(
                        [
                            Number(
                                line.coords[0][0]
                            ),
                            Number(
                                line.coords[0][1]
                            )
                        ]
                    );


            ctx.moveTo(
                first.x,
                first.y
            );


            for (
                let i = 1;
                i < line.coords.length;
                i++
            ) {


                const p =
                    exportMapObject
                        .latLngToContainerPoint(
                            [
                                Number(
                                    line.coords[i][0]
                                ),
                                Number(
                                    line.coords[i][1]
                                )
                            ]
                        );


                ctx.lineTo(
                    p.x,
                    p.y
                );

            }


            ctx.strokeStyle =
                line.color ||
                "#1d74f5";


            ctx.lineWidth =
                Number(
                    line.width
                ) || 5;


            ctx.lineCap =
                "round";


            ctx.lineJoin =
                "round";


            if (
                line.dash
            ) {


                const dash =
                    String(
                        line.dash
                    )
                    .split(
                        /\s+/
                    )
                    .map(
                        Number
                    )
                    .filter(
                        Number.isFinite
                    );


                if (
                    dash.length
                ) {

                    ctx.setLineDash(
                        dash
                    );

                }

            } else {

                ctx.setLineDash(
                    []
                );

            }


            ctx.stroke();


            ctx.restore();


            /*
                PDF用矢印
            */

            drawExportArrows(
                ctx,
                exportMapObject,
                line
            );

        }
    );


    /*
        地点
    */

    points.forEach(
        point => {


            const p =
                exportMapObject
                    .latLngToContainerPoint(
                        [
                            Number(
                                point.lat
                            ),
                            Number(
                                point.lng
                            )
                        ]
                    );


            ctx.save();


            ctx.beginPath();


            ctx.arc(
                p.x,
                p.y,
                11,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "#ffffff";


            ctx.fill();


            ctx.lineWidth =
                4;


            ctx.strokeStyle =
                "#1d74f5";


            ctx.stroke();


            ctx.restore();


            /*
                ラベル
            */

            if (
                showLabels
            ) {

                drawExportPointLabel(
                    ctx,
                    p,
                    point
                );

            }

        }
    );

}


/* =========================================================
   EXPORT ARROWS
========================================================= */

function drawExportArrows(
    ctx,
    exportMapObject,
    line
) {


    const coords =
        line.coords;


    if (
        !Array.isArray(
            coords
        ) ||
        coords.length <
            2
    ) {

        return;

    }


    const segmentLengths =
        [];


    let totalLength =
        0;


    for (
        let i = 0;
        i < coords.length - 1;
        i++
    ) {


        const a =
            L.latLng(
                coords[i][0],
                coords[i][1]
            );


        const b =
            L.latLng(
                coords[i + 1][0],
                coords[i + 1][1]
            );


        const distance =
            a.distanceTo(
                b
            );


        segmentLengths.push(
            distance
        );


        totalLength +=
            distance;

    }


    if (
        totalLength <=
        0
    ) {

        return;

    }


    const arrowCount =
        Math.max(
            1,
            Math.min(
                8,
                Math.floor(
                    totalLength /
                    180
                ) + 1
            )
        );


    for (
        let n = 1;
        n <= arrowCount;
        n++
    ) {


        const targetDistance =

            totalLength *

            (
                0.15 +

                (
                    0.70 *

                    (
                        n /
                        (
                            arrowCount +
                            1
                        )
                    )
                )
            );


        let accumulated =
            0;


        let segmentIndex =
            0;


        for (
            let i = 0;
            i < segmentLengths.length;
            i++
        ) {


            if (
                accumulated +
                segmentLengths[i]
                >=
                targetDistance
            ) {

                segmentIndex =
                    i;

                break;

            }


            accumulated +=
                segmentLengths[i];

        }


        const a =
            L.latLng(
                coords[
                    segmentIndex
                ][0],
                coords[
                    segmentIndex
                ][1]
            );


        const b =
            L.latLng(
                coords[
                    segmentIndex + 1
                ][0],
                coords[
                    segmentIndex + 1
                ][1]
            );


        const segmentLength =
            segmentLengths[
                segmentIndex
            ];


        const ratio =
            segmentLength > 0
                ? (
                    targetDistance -
                    accumulated
                ) /
                segmentLength
                : 0;


        const lat =
            a.lat +
            (
                b.lat -
                a.lat
            ) *
            ratio;


        const lng =
            a.lng +
            (
                b.lng -
                a.lng
            ) *
            ratio;


        const center =
            exportMapObject
                .latLngToContainerPoint(
                    [
                        lat,
                        lng
                    ]
                );


        const pa =
            exportMapObject
                .latLngToContainerPoint(
                    a
                );


        const pb =
            exportMapObject
                .latLngToContainerPoint(
                    b
                );


        const angle =
            Math.atan2(
                pb.y - pa.y,
                pb.x - pa.x
            );


        const size =
            Math.max(
                10,
                Math.min(
                    16,
                    (
                        Number(
                            line.width
                        ) || 5
                    ) * 2.4
                )
            );


        ctx.save();


        ctx.translate(
            center.x,
            center.y
        );


        ctx.rotate(
            angle
        );


        ctx.beginPath();


        ctx.moveTo(
            size,
            0
        );


        ctx.lineTo(
            -size * .65,
            -size * .55
        );


        ctx.lineTo(
            -size * .30,
            0
        );


        ctx.lineTo(
            -size * .65,
            size * .55
        );


        ctx.closePath();


        ctx.fillStyle =
            line.color ||
            "#1d74f5";


        ctx.shadowColor =
            "rgba(0,0,0,.25)";


        ctx.shadowBlur =
            2;


        ctx.fill();


        ctx.restore();

    }

}


/* =========================================================
   EXPORT POINT LABEL
========================================================= */

function drawExportPointLabel(
    ctx,
    position,
    point
) {


    let label =
        "";


    if (
        point.time
    ) {

        label +=
            point.time;

    }


    if (
        point.place
    ) {


        if (
            label
        ) {

            label +=
                "  ";

        }


        label +=
            point.place;

    }


    if (
        !label
    ) {

        return;

    }


    ctx.save();


    ctx.font =
        "bold 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Yu Gothic',sans-serif";


    ctx.textBaseline =
        "middle";


    const width =
        ctx.measureText(
            label
        ).width;


    const boxX =
        position.x +
        17;


    const boxY =
        position.y -
        14;


    const boxWidth =
        width +
        14;


    const boxHeight =
        28;


    ctx.fillStyle =
        "rgba(255,255,255,.94)";


    ctx.beginPath();


    if (
        typeof ctx.roundRect ===
        "function"
    ) {

        ctx.roundRect(
            boxX,
            boxY,
            boxWidth,
            boxHeight,
            7
        );

    } else {

        ctx.rect(
            boxX,
            boxY,
            boxWidth,
            boxHeight
        );

    }


    ctx.fill();


    ctx.strokeStyle =
        "rgba(0,0,0,.12)";


    ctx.lineWidth =
        1;


    ctx.stroke();


    ctx.fillStyle =
        "#111827";


    ctx.fillText(
        label,
        boxX + 7,
        position.y
    );


    ctx.restore();

}


/* =========================================================
   CAPTURE EXPORT PAGE
========================================================= */

async function captureExportPage(
    center,
    zoom,
    showLabels,
    baseType,
    width,
    height
) {


    const mapObject =
        createExportMap(
            width,
            height
        );


    mapObject.setView(
        center,
        zoom
    );


    /*
        ベース地図
    */

    if (
        baseType ===
        "satellite"
    ) {

        exportSatelliteLayer.addTo(
            mapObject
        );

    } else {

        exportNormalLayer.addTo(
            mapObject
        );

    }


    mapObject.invalidateSize();


    /*
        タイル読み込み
    */

    await waitForTiles(
        mapObject,
        5000
    );


    mapObject.invalidateSize();


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                500
            )
    );


    /*
        地図背景をキャプチャ
    */

    const canvas =
        await html2canvas(
            document.getElementById(
                "printArea"
            ),
            {

                backgroundColor:
                    "#ffffff",

                useCORS:
                    true,

                allowTaint:
                    false,

                scale:
                    1,

                logging:
                    false,

                imageTimeout:
                    15000

            }
        );


    /*
        線・矢印・地点を直接描画
    */

    drawExportVectorOverlay(
        canvas,
        mapObject,
        showLabels
    );


    /*
        後始末
    */

    try {

        mapObject.remove();

    } catch (
        error
    ) {}


    exportMap =
        null;


    return canvas;

}


/* =========================================================
   PDF EXPORT
========================================================= */

async function exportDetailedPDF() {


    if (
        points.length === 0 &&
        lines.length === 0
    ) {

        alert(
            "書き出す地点または線がありません。"
        );

        return;

    }


    const bounds =
        getRouteBounds();


    if (
        !bounds
    ) {

        alert(
            "ルート範囲を取得できませんでした。"
        );

        return;

    }


    /*
        PDF設定
    */

    const pdf =
        new window.jspdf.jsPDF(
            {

                orientation:
                    "landscape",

                unit:
                    "mm",

                format:
                    "a4",

                compress:
                    true

            }
        );


    /*
        A4横

        余白 10mm

        地図領域
    */

    const pageWidth =
        297;


    const pageHeight =
        210;


    const margin =
        10;


    const mapWidthMm =
        pageWidth -
        margin * 2;


    const mapHeightMm =
        pageHeight -
        margin * 2;


    /*
        CSSピクセル

        100mを細かく見るため
        1ページあたり約1000×650px
    */

    const captureWidth =
        1000;


    const captureHeight =
        Math.round(
            captureWidth *
            (
                mapHeightMm /
                mapWidthMm
            )
        );


    /*
        詳細レベル

        Zoom 18

        上五島周辺では
        約100mを十分細かく確認できる
        レベル。

        重要なのは、
        全体を無理やり1枚にしないこと。
    */

    const zoom =
        18;


    /*
        中心緯度
    */

    const center =
        bounds.getCenter();


    /*
        世界座標へ変換
    */

    function project(
        latlng
    ) {

        return map.project(
            latlng,
            zoom
        );

    }


    /*
        全データのピクセル範囲
    */

    let minX =
        Infinity;


    let maxX =
        -Infinity;


    let minY =
        Infinity;


    let maxY =
        -Infinity;


    function includeLatLng(
        lat,
        lng
    ) {


        const p =
            project(
                L.latLng(
                    lat,
                    lng
                )
            );


        minX =
            Math.min(
                minX,
                p.x
            );


        maxX =
            Math.max(
                maxX,
                p.x
            );


        minY =
            Math.min(
                minY,
                p.y
            );


        maxY =
            Math.max(
                maxY,
                p.y
            );

    }


    points.forEach(
        point => {

            includeLatLng(
                Number(
                    point.lat
                ),
                Number(
                    point.lng
                )
            );

        }
    );


    lines.forEach(
        line => {

            line.coords.forEach(
                coord => {

                    includeLatLng(
                        Number(
                            coord[0]
                        ),
                        Number(
                            coord[1]
                        )
                    );

                }
            );

        }
    );


    /*
        余白

        画面端で線や地点が切れないように
        100px程度追加
    */

    const exportPadding =
        140;


    minX -=
        exportPadding;


    maxX +=
        exportPadding;


    minY -=
        exportPadding;


    maxY +=
        exportPadding;


    const routeWidth =
        maxX -
        minX;


    const routeHeight =
        maxY -
        minY;


    /*
        1ページの表示領域
    */

    const pageWorldWidth =
        captureWidth;


    const pageWorldHeight =
        captureHeight;


    const columns =
        Math.max(
            1,
            Math.ceil(
                routeWidth /
                pageWorldWidth
            )
        );


    const rows =
        Math.max(
            1,
            Math.ceil(
                routeHeight /
                pageWorldHeight
            )
        );


    const totalPages =
        columns *
        rows;


    /*
        あまりに巨大な場合の安全確認
    */

    if (
        totalPages >
        200
    ) {

        const proceed =
            confirm(
                `このルートはかなり広いため、約${totalPages}ページになります。\n\nこのまま書き出しますか？`
            );


        if (!proceed) {

            return;

        }

    }


    /*
        オプション
    */

    const baseType =
        document.querySelector(
            'input[name="pdfMapType"]:checked'
        ).value;


    const showLabels =
        document.getElementById(
            "pdfLabels"
        ).checked;


    /*
        UI
    */

    const progress =
        document.getElementById(
            "exportProgress"
        );


    const progressBar =
        document.getElementById(
            "progressBar"
        );


    const progressText =
        document.getElementById(
            "progressText"
        );


    progress.classList.add(
        "show"
    );


    progressBar.style.width =
        "0%";


    /*
        PDFタイトル
    */

    let firstPage =
        true;


    /*
        ページ作成
    */

    for (
        let row = 0;
        row < rows;
        row++
    ) {


        for (
            let col = 0;
            col < columns;
            col++
        ) {


            const pageIndex =
                row *
                columns +
                col;


            const percent =
                Math.round(
                    (
                        pageIndex /
                        totalPages
                    ) *
                    100
                );


            progressBar.style.width =
                percent +
                "%";


            progressText.textContent =

                `ページ ${pageIndex + 1} / ${totalPages} を作成中…`;


            /*
                ページ中心の世界座標
            */

            const centerX =
                minX +
                (
                    col *
                    pageWorldWidth
                ) +
                pageWorldWidth /
                2;


            const centerY =
                minY +
                (
                    row *
                    pageWorldHeight
                ) +
                pageWorldHeight /
                2;


            const centerLatLng =
                map.unproject(
                    [
                        centerX,
                        centerY
                    ],
                    zoom
                );


            /*
                1ページキャプチャ
            */

            let canvas;


            try {

                canvas =
                    await captureExportPage(
                        [
                            centerLatLng.lat,
                            centerLatLng.lng
                        ],
                        zoom,
                        showLabels,
                        baseType,
                        captureWidth,
                        captureHeight
                    );

            } catch (
                error
            ) {

                console.error(
                    error
                );


                progress.classList.remove(
                    "show"
                );


                alert(
                    "PDF用の地図画像を作成できませんでした。\n\n航空写真の場合は、通信状況やタイル画像の読み込み状態によって失敗することがあります。"
                );


                return;

            }


            /*
                PDFへ追加
            */

            if (!firstPage) {

                pdf.addPage();

            }


            firstPage =
                false;


            /*
                ページ背景
            */

            pdf.setFillColor(
                255,
                255,
                255
            );


            pdf.rect(
                0,
                0,
                pageWidth,
                pageHeight,
                "F"
            );


            /*
                CanvasをJPEG化

                PNGよりPDF容量を抑える。
                線は既にCanvas上に描画済み。
            */

            const imageData =
                canvas.toDataURL(
                    "image/jpeg",
                    0.94
                );


            pdf.addImage(
                imageData,
                "JPEG",
                margin,
                margin,
                mapWidthMm,
                mapHeightMm,
                undefined,
                "FAST"
            );


            /*
                ページ番号
            */

            pdf.setFontSize(
                7
            );


            pdf.setTextColor(
                90,
                98,
                112
            );


            pdf.text(
                `${pageIndex + 1} / ${totalPages}`,
                pageWidth - margin,
                pageHeight - 3,
                {
                    align:
                        "right"
                }
            );


            /*
                次のページまで少し待つ

                iPad Safariのメモリ負荷を
                下げるため。
            */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        80
                    )
            );

        }

    }


    /*
        完了
    */

    progressBar.style.width =
        "100%";


    progressText.textContent =
        "PDFを保存しています…";


    await new Promise(
        resolve =>
            setTimeout(
                resolve,
                300
            )
    );


    const date =
        new Date()
            .toISOString()
            .slice(
                0,
                10
            );


    const suffix =
        baseType ===
            "satellite"
            ? "satellite"
            : "map";


    pdf.save(
        `route-reconstruction-100m-${suffix}-${date}.pdf`
    );


    progressText.textContent =
        `完了：${totalPages}ページ`;


    setTimeout(
        () => {

            progress.classList.remove(
                "show"
            );

            closePdfMenu();


            showHelp(
                `詳細PDFを書き出しました（${totalPages}ページ）`
            );

        },
        900
    );

}
